*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}

#q{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:#fff}
main{max-width:860px;margin:0 auto;padding:12px 12px 80px}
.s{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}

.s .d{font-size:13px;color:var(--sub)}

.s .c{font-size:12px;color:var(--sub);margin-top:2px}
.list{display:none;border-top:1px solid var(--line)}
.s.open .list{display:block}
.v{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;text-align:left;cursor:pointer;color:var(--ink)}
.v:last-child{border-bottom:0}
.v:hover{background:#faf9f6}
.v .p{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px}
.v.pdf .p{background:#b5533c;font-size:11px}
.v.off{color:var(--sub);cursor:default}
.v.off .p{background:#c9c6bd}
.v small{margin-left:auto;color:var(--sub);flex:none}
#m{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;z-index:20;align-items:center;justify-content:center;padding:12px}
#m.on{display:flex}
#box{width:100%;max-width:960px}
#bar{display:flex;justify-content:space-between;color:#fff;margin-bottom:8px;gap:12px}
#bar button{all:unset;cursor:pointer;padding:4px 10px;border:1px solid #fff8;border-radius:8px}
#fr{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
#fr iframe,#fr video{position:absolute;inset:0;width:100%;height:100%;border:0}
.none{text-align:center;color:var(--sub);padding:40px 0}
</style>

const app=document.getElementById('app'),q=document.getElementById('q');
function embed(u){
  let m;
  if(m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/))return{t:'i',s:'https://www.youtube.com/embed/'+m[1]+'?rel=0&autoplay=1'};
  if(m=u.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/(\w+))?/))return{t:'i',s:'https://player.vimeo.com/video/'+m[1]+(m[2]?'?h='+m[2]:'')};
  if(/\.(mp4|webm|mov)(\?|$)/i.test(u))return{t:'v',s:u};
  return{t:'i',s:u};
}
function play(v,s){
  const e=embed(v.url),fr=document.getElementById('fr');
  fr.innerHTML='';
  let el;
  if(e.t==='v'){el=document.createElement('video');el.controls=true;el.autoplay=true;el.playsInline=true;el.src=e.s}
  else{el=document.createElement('iframe');el.src=e.s;el.allow='autoplay; fullscreen; picture-in-picture';el.allowFullscreen=true}
  fr.appendChild(el);
  document.getElementById('ttl').textContent=s.date+' '+s.topic+'｜'+v.title;
  document.getElementById('m').classList.add('on');
}
function close(){document.getElementById('fr').innerHTML='';document.getElementById('m').classList.remove('on')}
document.getElementById('x').onclick=close;
document.getElementById('m').onclick=e=>{if(e.target.id==='m')close()};
function render(){
  const k=q.value.trim().toLowerCase();
  app.innerHTML='';
  const list=DATA.filter(s=>!k||(s.date+s.topic).toLowerCase().includes(k)||s.date.replace(/\//g,'').includes(k));
  if(!list.length){app.innerHTML='<div class="none">找不到符合的場次</div>';return}
  list.forEach((s,i)=>{
    const d=document.createElement('div');d.className='s'+(k||i===0?' open':'');
    const h=document.createElement('button');
    h.innerHTML='<div class="d"></div><div class="t"></div><div class="c"></div>';
    h.children[0].textContent=s.date;h.children[1].textContent=s.topic;const nv=s.videos.filter(v=>v.url).length;h.children[2].textContent=(nv?nv+' 支影片':'')+(nv&&s.pdf?'・':'')+(s.pdf?'講義 PDF':'');
    h.onclick=()=>d.classList.toggle('open');
    const l=document.createElement('div');l.className='list';
    if(s.pdf){const a=document.createElement('a');a.className='v pdf';a.href=s.pdf;a.target='_blank';a.rel='noopener';a.style.textDecoration='none';
      a.innerHTML='<span class="p">PDF</span><span>講義 PDF</span><small>開啟／下載</small>';l.appendChild(a)}
    s.videos.filter(v=>v.url).forEach(v=>{
      const b=document.createElement('button');b.className='v'+(v.url?'':' off');
      b.innerHTML='<span class="p">▶</span><span></span><small></small>';
      b.children[1].textContent=v.title;
      if(!v.url)b.children[2].textContent='準備中';
      else b.onclick=()=>play(v,s);
      l.appendChild(b);
    });
    d.append(h,l);app.appendChild(d);
  });
}
q.oninput=render;render();
