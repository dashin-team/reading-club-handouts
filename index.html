<title>讀書會講義與重點整理</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#222;--sub:#6b6b66;--line:#e4e1da;--accent:#2f6f5e}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 8px}
#q{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:#fff}
main{max-width:860px;margin:0 auto;padding:12px 12px 80px}
.s{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.s>button{all:unset;display:block;width:100%;box-sizing:border-box;padding:14px 16px;cursor:pointer}
.s .d{font-size:13px;color:var(--sub)}
.s .t{font-size:16px;font-weight:600}
.s .c{font-size:12px;color:var(--sub);margin-top:2px}
.list{display:none;border-top:1px solid var(--line)}
.s.open .list{display:block}
.v{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;text-align:left;cursor:pointer;color:var(--ink)}
.v:last-child{border-bottom:0}
.v:hover{background:#faf9f6}
.v .p{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px}
.v.pdf .p{background:#b5533c;font-size:11px}
.v.off{color:var(--sub);cursor:default}
.v.off .p{background:#c9c6bd}
.v small{margin-left:auto;color:var(--sub);flex:none}
#m{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;z-index:20;align-items:center;justify-content:center;padding:12px}
#m.on{display:flex}
#box{width:100%;max-width:960px}
#bar{display:flex;justify-content:space-between;color:#fff;margin-bottom:8px;gap:12px}
#bar button{all:unset;cursor:pointer;padding:4px 10px;border:1px solid #fff8;border-radius:8px}
#fr{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
#fr iframe,#fr video{position:absolute;inset:0;width:100%;height:100%;border:0}
.none{text-align:center;color:var(--sub);padding:40px 0}
.tabs{display:flex;gap:8px;margin-top:8px}
.tabs button{flex:1;padding:8px 6px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--sub);cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sum{padding:12px 16px;border-bottom:1px solid var(--line);background:#fcfbf8}
.thesis{font-size:15px;font-weight:600;line-height:1.55}
.thesis:before{content:"核心主旨";display:block;font-size:12px;font-weight:600;color:var(--accent);margin-bottom:2px}
.sum details{margin-top:8px}
.sum summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600;padding:4px 0;list-style:none}
.sum summary::-webkit-details-marker{display:none}
.sum summary:before{content:"▸ "}
.sum details[open]>summary:before{content:"▾ "}
.pts,.tks{margin:6px 0 0;padding-left:20px;font-size:14.5px;line-height:1.6}
.pts li,.tks li{margin:5px 0;overflow-wrap:anywhere}
.lbl{font-size:12px;font-weight:600;color:var(--accent);margin:10px 0 0}
.all article{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:14px 16px}
.all .d{font-size:13px;color:var(--sub)}
.all h2{font-size:16px;margin:0 0 8px}
.all .thesis{margin-bottom:4px}
.all .pdfl{display:inline-block;margin-top:10px;font-size:13px;color:#b5533c;text-decoration:none;border:1px solid #e6c9c0;border-radius:8px;padding:4px 10px}
.cnt{font-size:12px;color:var(--sub);margin:4px 2px}
</style>
</head>

y": "20261015第7段煩惱就是成交善緣", "title": "第7段　煩惱就是成交善緣", "url": ""}, {"key": "20261015第8段自然無礙轉介紹", "title": "第8段　自然無礙轉介紹", "url": ""}, {"key": "20261015第9段老實做事信任無價", "title": "第9段　老實做事信任無價", "url": ""}]}, {"date": "2026/10/01", "topic": "人脈潛規則成交心法", "thesis": "成交的關鍵是捧場、支持、照顧與輕鬆沒壓力；以「壽險帳」作為單純的核心——左口袋換右口袋、想給誰就給誰、倍數保額、立刻領到，並全心投入這件事。", "points": ["第1段：不要尋找銷售公式，客戶是活生生的個人，要點滴微調；以 Timberland 新店開幕要捧場支持為例，不要擺教育、教訓客戶的姿態；不要一味複製別人做法，要萃取核心善緣；客戶只是喜歡跟你在一起，捧場支持照顧在客戶輕鬆沒壓力的額度範圍內。", "第2段：講義反省「客戶幾億資產」講很多、成交多少才是真的；「財富傳承」四個字容易造成銷售誤區（以為要把客戶全部遺產吃下來）；「壽險帳」先用非核心閒錢提撥建立就好，有成交才是真的，50萬保費也是善緣；核心功能：左口袋換右口袋、你想給誰就給誰、倍數保額、立刻領到；「試水溫」、躉繳當作期繳賣。", "第3段：遺產稅最終體悟——研究怎麼不繳遺產稅，路就走偏；好好準備壽險帳就好；你提撥3,000萬、保險公司也幫你提撥3,000萬，6,000萬立刻領到，等於保險公司幫你出一半、遺產稅省一半；3,000萬存款什麼都不做，100%列入遺產並被凍結；講義說即使被課10至20%也不吃虧。", "第4段：遺產內轉到遺產外：一輩子擁有銀行帳、股票帳、不動產帳，也要有壽險帳；前三者在被繼承人死亡瞬間都會被凍結12到18個月，只有壽險帳不會凍結；「你只有財產、沒有遺產，遺產是子女的，子女只會抱怨等太久、分太少」。", "第5段：不要狹隘聚焦解決具體問題（遺產稅、繼承風險、家族爭產），客戶容易淪為拒絕、辯論、恐懼；家家有本難念的經，具體問題未必壽險或任何工具可徹底解決；更多成交場景只是單純想留一筆錢給想照顧的人，回歸光明溫暖的愛與關懷；壽險帳不用執行，保險公司永遠會讓受益人立刻領到。", "第6、7段：只有一個孩子也要提撥壽險帳，就像小時候替孩子提撥教育基金帳戶；即使新法讓不動產可設定抵押權給國稅局後以市價貸款或出售，仍須全體繼承人同意；遺產申報加上審核期間約12到18個月，資產越複雜越久；留給孩子的遺產是驚喜還是驚嚇，跟開福袋一樣；簡化資產是智慧。", "第8段：互惠原則——送的禮、請吃的飯、對人的好；不要帶著成交執念，練習放鬆、放空，去認識理解客戶的生命故事；做筆記是好習慣；練習隨時說「謝謝你」，幫助過你的人一直等著你的感謝；每個人都有煩惱，光願意好好聽就贏了一半。", "第9段：不是教會你再去說服客戶，而是直接說動你自己投保壽險；講義的普通常識能讓同學監測客戶的錯誤常識、接地氣戳中痛點；不敢開口談壽險，是因為沒有全心投入一件事；要有發自內心的信仰，才能超越成交恐懼與執著，擁有溫暖淡定的底氣。"], "takeaways": ["提撥可以從非核心閒錢開始，50萬也是善緣；先成交一小筆，勝過談一大堆。", "每次拜訪前問自己：我今天要『捧場支持』的是什麼，而不是『解決』什麼問題。"], "pdf": "pdf/20261001.pdf", "videos": [{"key": "20261001完整影片", "title": "完整影片", "url": ""}, {"key": "20261001第1段捧場成交沒壓力", "title": "第1段　捧場成交沒壓力", "url": ""}, {"key": "20261001第2段閒錢提撥人壽保險", "title": "第2段　閒錢提撥人壽保險", "url": ""}, {"key": "20261001第3段遺產稅的最終體悟", "title": "第3段　遺產稅的最終體悟", "url": ""}, {"key": "20261001第4段遺產內轉到遺產外", "title": "第4段　遺產內轉到遺產外", "url": ""}, {"key": "20261001第5段不要解決具體問題", "title": "第5段　不要解決具體問題", "url": ""}, {"key": "20261001第6段只有一個孩子繼承", "title": "第6段　只有一個孩子繼承", "url": ""}, {"key": "20261001第7段遺產是驚喜還是驚嚇", "title": "第7段　遺產是驚喜還是驚嚇", "url": ""}, {"key": "20261001第8段互惠原則影響力", "title": "第8段　互惠原則影響力", "url": ""}, {"key": "20261001第9段全身心投入一件事", "title": "第9段　全身心投入一件事", "url": ""}]}, {"date": "2026/09/17", "topic": "變額年金險中小企業傳承", "thesis": "變額年金、公司持有不動產、閉鎖型公司與家族股權信託等進階工具各有盲點；對中小企業主，簡單有效的作法仍是「遺囑搭配壽險」，讓接班人接班、其他子女拿現金。", "points": ["第1段｜變額年金保險：壽險事故是被保險人死亡、年金事故是被保險人活著進入給付期；累積期被保險人死亡時事故尚未發生，保價金依要保人／被保險人是否同一人返還或作為要保人遺產；實務上多當投資、領配息創造現金流，幾乎不進入給付期、要保人保有控制權。", "第2段｜最低身故保證給付：本質上不是年金，而是在累積期附加的壽險，費率另有「身故保證費」費率表；與變額萬能壽險最大差異是幾乎不看體況；實質課稅原則下，累積期、給付期身故保險金以定額性、互助性檢視，可能課徵遺產稅；講義強調客戶買變額年金不是為了免遺產稅，而是領配息創造現金流；能否完全成為遺產外現金、排除特留分扣減權，有待法院判決認定。", "第3段｜公司持有不動產：公司持有不動產並出售股權，若持有公司過半數股權且公司價值過半數是不動產，適用房地合一稅（110年6月30日以前取得的舊股權、104年12月31日以前取得的舊不動產可不適用）；公司出售不動產要繳土地增值稅、房屋營業稅與所得稅，盈餘分配個人所得稅28%、不分配繳保留盈餘稅5%；公司持有住宅不動產採內政部許可制，5年內不得移轉；講義判斷政策只會越來越緊縮。", "第4段｜閉鎖型公司：有限公司董事經表決權2/3以上同意、董事長經董事過半數同意；股份有限公司採累積投票制；公司股權繼承有分散、子女轉售、離婚、負債被強制執行等風險，外人可能進入公司；閉鎖型股份公司可設股份轉讓限制、特別股、複數表決權，但講義指出章程限制有爭議，可設計「強制時價買斷條款」並以壽險買斷股權。", "第5段｜家族股權信託：委託人創辦人、受託人銀行、受益人繼承人，搭配家族委員會、家族辦公室；風險在指示權爭奪、人性風險；若委託人保留實質控制權（可撤銷、變更受益人），仍為自益信託，須課遺產稅、仍有配偶剩餘財產請求權與特留分扣減權；若真放棄控制權，贈與稅就來了；講義認為「百年家業基業長青」是可怕的幻覺，股權轉讓、增資、併購被鎖死，到最後子女只會有抱怨與怨恨。", "第6段｜遺囑搭配壽險：不敢說完美但簡單有效；遺囑決定公司股權歸屬接班人，讓接班人完全接班，不受兄弟姊妹指手畫腳；載明現金補償條款，由接班人現金補償兄弟姊妹的應繼分、特留分；壽險受益人指定接班人，預留立刻領到的遺產外現金履行補償條款並完成股權過戶；遺產稅未完稅，股權可能被強制執行、接班計畫崩盤。", "第7段｜中小企業主心法：頭家常幻想百年家業，把子女箍進公司；講義提醒創辦人不在後公司還會一樣賺錢嗎？子女能扛得住公司倒閉負債嗎？接班人其實很可憐，無法自己決定；子女沒說出口的心願是「能否變現」，留立刻領到的壽險；沒勇氣寫遺囑，光靠壽險也能照顧想照顧的人。", "結語：一輩子能做到「不要讓子女麻煩」已經非常了不起；講義再次舉張榮發案，假設改留1,000億壽險，故事會不會很不一樣；凡事剛剛好就好，不要做過頭（中道智慧）。"], "takeaways": ["對企業主，先問『你的接班人是誰、其他子女想要什麼』，再談股權、補償與保額。", "高端架構（信託、閉鎖公司）可略懂，保持簡單，把重心放在遺囑加壽險。"], "pdf": "pdf/20260917.pdf", "videos": [{"key": "20260917完整影片", "title": "完整影片", "url": ""}, {"key": "20260917第1段變額年金保險", "title": "第1段　變額年金保險", "url": ""}, {"key": "20260917第2段最低身故保證給付", "title": "第2段　最低身故保證給付", "url": ""}, {"key": "20260917第3段公司持有不動產", "title": "第3段　公司持有不動產", "url": ""}, {"key": "20260917第4段閉鎖型公司", "title": "第4段　閉鎖型公司", "url": ""}, {"key": "20260917第5段家族股權信託", "title": "第5段　家族股權信託", "url": ""}, {"key": "20260917第6段遺囑搭配人壽保險", "title": "第6段　遺囑搭配人壽保險", "url": ""}, {"key": "20260917第7段中小企業主新法", "title": "第7段　中小企業主新法", "url": ""}]}, {"date": "2026/09/03", "topic": "遺贈稅法修法人脈潛規則", "thesis": "遺贈稅法與實物抵繳最新修法的重點，講義提醒不必鑽研；更重要的是回到「我是壽險專家」，以做人與簡單的普通常識，聚焦倍數保額、立刻領到。", "points": ["第1段｜遺贈稅法修法（講義整理）：刪除遺囑執行人為納稅義務人，確立繼承人及受遺贈人為納稅義務人，以被繼承人遺產為限負繳納義務；死亡前二年內贈與特定親屬視為擬制遺產，受贈人按比例單獨開單；修法走向為「拿多少遺產、繳多少遺產稅」。", "講義算例：被繼承人4,000萬、配偶2,500萬，死亡前二年贈與配偶1,000萬；依遺贈稅法，配偶剩餘財產扣除額＝((4,000萬＋1,000萬)－2,500萬)÷2＝1,250萬；依民法，應給付配偶的剩餘財產請求權＝(4,000萬－2,500萬)÷2＝750萬，配偶受贈的1,000萬不分配，且擬制遺產不能當作已履行給付。", "第2段｜實物抵繳修法：存款、不動產、股票；銀行存款過半數同意可抵繳，新法明文化；不動產新法設定抵押權給國稅局後取得「同意移轉證明書」，以市價向銀行貸款或直接出售；股票向券商簽切結書、向銀行取得履約保證書，再向國稅局申請同意移轉證明書後以市價賣出；不動產設定抵押與股票申請出售都須「全體繼承人同意」。講義提醒移送強制執行不會執行繼承人固有財產，並稱被繼承人完全不處理只是麻煩、沒什麼了不起，並勸同學不要鑽研稅法，回歸壽險本分本業。", "第3段｜我是壽險專家：「不計入遺產總額」耽誤無數業務員，演變成要專精遺贈稅法，路一開始就走偏；搞到最後客戶寫遺囑想到你、報遺產稅想到你、辦繼承想到你，就是買保險沒想到你；預留遺產稅源，壽險仍是最簡單的工具，重點是「倍數保額」「立刻馬上領到」。", "第4段｜不懂人情全是事故：資產股權化、股權信託、閉鎖型公司、家族辦公室學不完，學到最後還是要賣保險；姿態不要擺太高，顧問式銷售很搞笑，不要一副拯救客戶；不要再傳早安圖、看短影片外放、不得體穿著、口頭禪偏見歧視語、政治雷區、從文字訊息就看得出業績好壞。", "第5段｜喜歡跟你在一起：不是想盡辦法讓人喜歡你，而是從真心喜歡跟這個人在一起開始；與人相處要投緣，共同興趣愛好，挑你真正喜歡做的事一起做；極簡化自我介紹、商品介紹與開場，「我永遠只談壽險」；客戶只聽得懂新聞故事與普通常識，不要追問客戶隱私，要開講別人的新聞故事。", "第6段｜直球對決壽險：原始出廠設定為要保人、被保險人同一人、受益人指定想照顧的人；傳承壽險範例：總繳3,000萬、宣告利率與分紅達標、解約金大於保費、倍數保額6,000萬以上、立刻領到；不要試算遺產稅，起手式錯了（客戶不會把全部財產跟你交代），聚焦談「壽險保額帳」；「躉繳當作期繳賣」，可分年提撥。", "第7段｜練習場景：替子女買房成家雙保險；中小企業主突然離世留給妻小什麼；適時簡化變現、轉入壽險帳；講義提到「如果張榮發不是留遺囑留整個集團，改留1,000億壽險，故事會不會很不一樣」，以及亞洲資產管理中心的「保單融資」讓壽險不動產化，「壽險這棟房」提撥3,000萬都在、保險公司再多出3,000萬。"], "takeaways": ["修法細節只需知道方向：納稅義務人、擬制遺產、實物抵繳都在加強『能徵收到』；你的工作仍是預留現金。", "練習用一句話自我介紹：『我專門協助家庭用壽險預留倍數保額』。"], "pdf": "pdf/20260903.pdf", "videos": [{"key": "20260903完整影片", "title": "完整影片", "url": ""}, {"key": "20260903第1段遺贈稅法最新修法", "title": "第1段　遺贈稅法最新修法", "url": ""}, {"key": "20260903第2段實物抵繳最新修法", "title": "第2段　實物抵繳最新修法", "url": ""}, {"key": "20260903第3段我是人壽保險專家", "title": "第3段　我是人壽保險專家", "url": ""}, {"key": "20260903第4段不懂人情全是事故", "title": "第4段　不懂人情全是事故", "url": ""}, {"key": "20260903第5段喜歡跟你再一起", "title": "第5段　喜歡跟你再一起", "url": ""}, {"key": "20260903第6段直球對決人壽保險", "title": "第6段　直球對決人壽保險", "url": ""}, {"key": "20260903第7段人壽保險練習場景", "title": "第7段　人壽保險練習場景", "url": ""}]}, {"date": "2026/08/20", "topic": "保險財富傳承普通常識", "thesis": "以115年遺產稅基本數字與流程為底，複習「遺產凍結＋現金缺口」的普通常識，並以遺囑三部曲與壽險回應：保護在家照顧的子女、處理房貸與共有不動產。", "points": ["115年遺產稅（講義數字）：起徵點遺產總額約2,136萬、免稅額1,333萬、喪葬費扣除額138萬、配偶扣除額553萬；課稅級距遺產淨額5,621萬以下10%、1億1,242萬以下15%、超過1億1,242萬20%。", "流程：六個月內申報、等待國稅局審核發單、二個月內繳納，逾期每三天罰1%滯納金，三十天後送強制執行；未繳清前不得分割遺產、交付遺贈、辦理移轉登記，須有「遺產稅繳清證明書」；全體繼承人、全部遺產被移送強制執行，與行政執行署全面開戰。", "遺產稅真正的風險不只是稅單金額，而是從死亡瞬間所有遺產被凍結（繼承現金流風險）；孩子手上要有足夠現金，銀行存款辦不到、壽險辦得到；壽險是受益人領取的財產，被列入遺產總額也只是擬制遺產。", "遺囑的強大功能在決定各項遺產所有權歸屬；要預留特留分補償，否則受侵害者可向取得遺產者主張扣減權；補償不限於遺產標的，可透過遺囑搭配壽險；圓滿遺產分配三部曲：公證遺囑、現金補償條款、壽險。", "共有不動產：無論公同共有或分別共有，共有人可隨時主張分割；遺產中的不動產無法協議分割時由法院變價分割拍賣，還要繳房地合一稅；解法是由特定繼承人取得不動產完整所有權，並預留找補其他繼承人的壽險。", "房貸風險：活著時繳得起每月房貸，突然走了孩子有能力繳嗎？遺產稅完稅後要動用銀行存款償還貸款，需全體繼承人同意；房貸不會因喪事而停繳，沒繳就被銀行法拍、資不抵債後仍追償；預留處理房貸的壽險是給子女最後的禮物。", "替子女買房成家留每月貸款讓年輕人繳，偷偷買壽險、受益人填寫扛房貸的子女（雙保險的智慧）；客戶說保險買很多了，重點是現在年齡體況還能買到多少保額，建議免體檢、最高保額。", "晚年面向：壽險可先保護自己的晚年（醫療保障、緊急時放款），再留給受益人；也可照顧想照顧的孫子女、孝順的媳婦、慈善宗教團體（遺澤保單）；保險金可分期給付保障三十年生活；結尾回到福報與善念：積善種福、錢無法傳承唯有福慧得以傳家。"], "takeaways": ["把『最少必要的普通常識』整理成一頁：數字、流程、凍結、補償，隨時複習。", "結合客戶真實情況，選一個場景（房貸或共有房產）說清楚就好。"], "pdf": "pdf/20260820.pdf", "videos": [{"key": "20260820完整影片", "title": "完整影片", "url": ""}, {"key": "20260820第1段預留稅源人壽保險", "title": "第1段　預留稅源人壽保險", "url": ""}, {"key": "20260820第2段繼承現金流風險", "title": "第2段　繼承現金流風險", "url": ""}, {"key": "20260820第3段遺產分配的三部曲", "title": "第3段　遺產分配的三部曲", "url": ""}, {"key": "20260820第4段保護照顧父母的人", "title": "第4段　保護照顧父母的人", "url": ""}, {"key": "20260820第5段房貸繼承風險", "title": "第5段　房貸繼承風險", "url": ""}, {"key": "20260820第6段替子女買房雙保險", "title": "第6段　替子女買房雙保險", "url": ""}, {"key": "20260820第7段自益保單新思想", "title": "第7段　自益保單新思想", "url": ""}, {"key": "20260820第8段福慧傳家福報思想", "title": "第8段　福慧傳家福報思想", "url": ""}]}, {"date": "2026/08/06", "topic": "最新保險實質課稅原則", "thesis": "「不計入遺產總額」這句話耽誤了無數業務員；實質課稅原則已超越舊八樣態，講義以定額性、互助性檢視各類保單，建議業務員不保證免稅，專注倍數保額與繼承現金流風險。", "points": ["壽險不是遺產（保險法第112條）與要不要列入遺產總額計算（遺贈稅法第16條第9款、實質課稅原則）要分開看：身故保險金永遠只能由受益人領取，是否列入遺產總額就是國稅局說了算。", "講義批評：當越來越多業務員要專精「遺產及贈與稅法」，路一開始就走偏；多數人是專業底氣不足、想戴面具，不敢直接說「我是壽險專家」；數以百億的資金灌入高額壽險、連投資型保單投資帳戶也說不計入，催生了實質課稅原則。", "八樣態：高齡投保、帶病或重病投保、死前短期投保、鉅額投保、躉繳投保、舉債投保、密集投保、保險給付相當於總繳保費；講義認為只聚焦八樣態已落後太多，違反八樣態不一定課稅，沒違反也不一定不課稅。", "法院與立法意旨：保險目的在分散風險、以較少保費獲得較高保障；講義引述見解，將預計面臨課稅的現金轉為保險給付形式，但經濟實質仍是原現金者，從量能原則屬遺產一部分，應納入課稅。", "最新國稅局審查重點：投保時空背景（年齡、體況、動機）與保險商品是否有定額性、互助性；講義列出多個國稅局實例，如美元養老保險身故保險金為保險金額、躉繳保費1.05倍、保價金三者擇一，各商品比較，以「身故保險金要倍數於保險費、保價金是存的」作為極簡化判斷標準。", "投保型保險：投資型保險「保險帳戶」與「投資帳戶」分開看；投資帳戶一定列入遺產總額計算，超過部分才屬保險帳戶；變額年金實務上多數不會進入給付期，累積期要保人、被保險人死亡返還保價金給繼承人，列入要保人遺產。", "分紅型、利變型保單（百億神單）：傳統型終身壽險一開始就有定額保額，保證給付部分完全符合定額性、互助性；分紅、增值回饋增購保額亦符合；本質上都是傳統保障型，保費買定額倍數保額。", "結論：壽險業務員本分本業不負責保證「不計入遺產總額」；不要猜測國稅局（行政訴訟實質勝訴率約0.3%）；客戶什麼都不買，銀行存款仍列入遺產且被凍結；114年遺產稅申報184,122件、免稅約93%，講義指出與93%談遺產稅沒意義，但幾乎100%的家庭都有繼承現金流風險；真正的超業專注本分本業，「在我的戰場，我說的算」。"], "takeaways": ["不保證免稅，改說『保額、受益人立即領到、可補現金缺口』，並如實申報。", "準備定額性與互助性的白話說明，面對客戶或國稅局詢問時有條理。"], "pdf": "pdf/20260806.pdf", "videos": [{"key": "20260806完整影片", "title": "完整影片", "url": ""}, {"key": "20260806第1段被保險免稅耽誤", "title": "第1段　被保險免稅耽誤", "url": ""}, {"key": "20260806第2段聚焦八大樣態落後", "title": "第2段　聚焦八大樣態落後", "url": ""}, {"key": "20260806第3段定額性互助性解析", "title": "第3段　定額性互助性解析", "url": ""}, {"key": "20260806第4段定額性互助性練習", "title": "第4段　定額性互助性練習", "url": ""}, {"key": "20260806第5段投資型保單解析", "title": "第5段　投資型保單解析", "url": ""}, {"key": "20260806第6段分紅利變保單解析", "title": "第6段　分紅利變保單解析", "url": ""}, {"key": "20260806第7段聚焦倍數保額壽險", "title": "第7段　聚焦倍數保額壽險", "url": ""}, {"key": "20260806第8段繼承現金流風險", "title": "第8段　繼承現金流風險", "url": ""}]}, {"date": "2026/07/23", "topic": "大S遺產繼承案例", "thesis": "以大S遺產繼承新聞為場景，說明遺產凍結、海外存款申報、貸款代墊與配偶剩餘財產請求權的實際困境；講義主張提前以公證遺囑、現金補償條款與壽險預留遺產外現金。", "points": ["納稅義務人有三位：配偶與兩名未成年子女；因子女未成年且母親已過世，法定代理人只能是前夫（爸爸），因此遺產稅申報、遺產處分、貸款清償、協議分割，都由配偶與前夫握有話語權。", "遺產結構（講義陳述）：台北信義豪宅與國家藝術館豪宅（孝親房）都有鉅額貸款，銀行存款僅約200多萬；多年收入存在海外銀行，若不如實交代申報，國稅局不會結案、沒有繳款書、無法繳清，遺產被凍結無法動，申報已拖了一年多。", "講義指出本案不會申請實物抵繳：不動產以公告現值抵繳不划算，必須有人代墊遺產稅；海外銀行帳戶的實質管理人是S媽，若是你會拿出來代墊遺產稅嗎？若無人代墊，銀行存款杯水車薪，不動產可能被強制執行，家人被迫搬家。", "遺產凍結但貸款不會凍結：不動產貸款每月一百多萬，過去一年多都由前夫代墊，已繳不下去，只能降價出售或被銀行法拍；遺產稅完稅拿到繳清證明書後，動用銀行存款償還貸款仍要經過配偶同意，進入民法繼承程序，任何環節卡住貸款繳不出，不動產就被法拍。", "配偶剩餘財產請求權是金錢債權，配偶主張後仍得再以繼承人身分繼承遺產；婚前財產的婚後孳息、無償取得財產的孳息（租金、股息、保價金增值）應列入婚後財產計算，但婚前財產的婚後增值不計入；遺囑無法對抗此請求權，可用壽險預留現金補償。", "配偶繼承權是遺產的物權；本案三位繼承人均分遺產各1/3，婚前財產、繼承財產雖不列入夫妻剩餘財產計算，但要列入繼承遺產計算，配偶對全部遺產（含婚前財產）擁有1/3應繼分；須透過遺囑歸屬遺產所有權，再預留壽險補償。", "S媽是第二順位繼承人？講義指出母親（S媽）因父親在世而沒有繼承權、沒有法定代理權，遺產從頭到尾與她無關；講義提醒法律與情感不要混為一談，建議以遺囑搭配壽險保護老人與子女，並可考慮保險金信託與信託監察，避免錢被前夫挪用。", "後續故事：講義提到前夫為兩名未成年子女設立信託帳戶讓金流清楚；配偶「從頭到尾默不出聲，最後是贏家，因為最後等分錢就好、永遠有1/3應繼分」；並提醒贈與在物權移轉前可撤銷，除非經公證或為履行道德義務。"], "takeaways": ["時事案例提醒客戶：配偶、未成年子女、父母之間的法律關係與情感預期可能完全不同，要提前書面安排。", "遇到海外存款，提醒如實申報；否則遺產稅無法結案、全部遺產被凍結更久。"], "pdf": "pdf/20260723.pdf", "videos": [{"key": "20260723完整影片", "title": "完整影片", "url": ""}, {"key": "20260723第1段遺產稅風險", "title": "第1段　遺產稅風險", "url": ""}, {"key": "20260723第2段繼承現金流風險", "title": "第2段　繼承現金流風險", "url": ""}, {"key": "20260723第3段配偶剩餘財產分配", "title": "第3段　配偶剩餘財產分配", "url": ""}, {"key": "20260723第4段配偶繼承權風險", "title": "第4段　配偶繼承權風險", "url": ""}, {"key": "20260723第5段完稅後的繼承風險", "title": "第5段　完稅後的繼承風險", "url": ""}, {"key": "20260723第6段照顧想要照顧的人", "title": "第6段　照顧想要照顧的人", "url": ""}]}, {"date": "2026/07/02", "topic": "繼承現金流風險", "thesis": "高資產客戶買壽險，多半不是真的喜歡保險，而是不想讓子女麻煩；用真實繼承流程帶出「繼承現金流風險」，說明遺產凍結期間的各種連鎖問題，讓受益人立刻有倍數保額可用。", "points": ["成交心法：像建築思想「第一堅實、第二耐用、最後才講求美觀」；就像沒有人真的喜歡某種喪禮形式，而是不想讓子女麻煩（天下父母心）；不要只顧著講商品多好，要練習留意客戶的生命故事，成交善緣都從故事開始。", "高資產客戶繼承像開福袋：生前不能調閱被繼承人財產總歸戶，有資產、有負債、沒現金；收到遺產稅繳款書時，多數繼承人沒有足夠現金；縱使有錢，誰願意代墊遺產稅、多久才能拿回來？", "實物抵繳實況：任何遺產抵繳都要繼承人過半數同意；銀行存款抵繳失敗則全部遺產不得抵繳；不動產以公告現值、評定現值抵繳不划算；上市櫃股票以死亡日成交價為準，漲價算國家的、跌價只能比例抵繳；家族公司股權與企業總部多半不願抵繳，實務上除存款外很少人願意，寧願民間借貸繳稅。", "強制執行：國稅局只對「遺產」執行，法務部行政執行署可對「繼承人財產」執行；講義引新聞（劉姓家族遺產稅1億3,000萬、國稅局假扣押與執行），繼承人財產被全面凍結、現金流缺氧，會立刻投降。", "四貸同堂（房貸、信貸、車貸、股貸）：遺產凍結但貸款不會凍結，下個月仍要繳；繼承人沒有錢只能眼睜睜看著不動產被銀行法拍；股票質押維持率130%（市價100元、質押60元，不能跌破78元），遺產凍結時無法補錢補股票，可能被強制斷頭。", "遺產稅完稅後仍有難關：拿到繳清證明書遺產解封，要動用銀行存款償還貸款需全體繼承人同意；遺產分割協議需全體同意、出售不動產需過半數同意；任何共有人可聲請遺產分割訴訟，講義稱之為「留給子女最悲慘的禮物」；變價拍賣後還要繳房地合一稅。", "講義數字：114年度遺產稅總申報件數184,122件，免稅約93%，10%級距約6.1%、15%約0.5%、20%約0.4%；2025年繼承遺產總額約1兆2,000億，新契約壽險保費破1兆，遺產稅約443億；講義主張高資產客戶買壽險是為了衝保額，不是免遺產稅。", "對策：晚年適時簡化、變現、理債，部分非核心資產轉入立刻領到的倍數保額壽險帳，是智慧也是慈悲；子女沒說出口的心願是「能否變現」；替子女買房成家、留貸款讓年輕人繳，再偷偷買壽險受益人填扛房貸的子女（雙保險的智慧）；客戶說保險買很多了，重點是現在年齡體況還能買到多少保額。"], "takeaways": ["談話可以從『四貸同堂』開始：你的家人明天能不能繼續繳這些貸款？", "用客戶自己的故事（子女、貸款、股票質押）取代商品說明。"], "pdf": "pdf/20260702.pdf", "videos": [{"key": "20260702完整影片", "title": "完整影片", "url": ""}, {"key": "20260702第1段不想讓子女麻煩", "title": "第1段　不想讓子女麻煩", "url": ""}, {"key": "20260702第2段繼承流程風險", "title": "第2段　繼承流程風險", "url": ""}, {"key": "20260702第3段能否對繼承人執行", "title": "第3段　能否對繼承人執行", "url": ""}, {"key": "20260702第4段房貸繼承風險", "title": "第4段　房貸繼承風險", "url": ""}, {"key": "20260702第5段股票質押繼承風險", "title": "第5段　股票質押繼承風險", "url": ""}, {"key": "20260702第6段完稅後房貸風險", "title": "第6段　完稅後房貸風險", "url": ""}, {"key": "20260702第7段立刻領人壽保險金", "title": "第7段　立刻領人壽保險金", "url": ""}, {"key": "20260702第8段遺產訴訟悲慘禮物", "title": "第8段　遺產訴訟悲慘禮物", "url": ""}, {"key": "20260702第9段子女心願能否變現", "title": "第9段　子女心願能否變現", "url": ""}, {"key": "20260702第10段人壽保險衝保額", "title": "第10段　人壽保險衝保額", "url": ""}]}, {"date": "2026/06/18", "topic": "三民書局爭產案例", "thesis": "從三民書局爭產案可見：存活配偶的剩餘財產請求權威力強大、遺囑無法對抗；家族爭產使遺產凍結很久，必須預留遺產外現金，避免被迫以企業總部與股權受強制執行。", "points": ["案例事實（講義整理）：被繼承人於106年1月死亡，遺產總額約11.5億元、遺產淨額約7.7億元、配偶扣除額約4.62億元，核定遺產稅約5,300萬元；配偶委由律師主張剩餘財產請求權並起訴，後於111年死亡，法院駁回訴訟，國稅局移送強制執行，112年完成5,995萬元遺產稅執行。", "夫妻一方死亡時，先發生夫妻剩餘財產分配，再繳完遺產稅，剩下的才成為繼承遺產；存活配偶主張不需與其他繼承人分擔，清算後仍可再以繼承人身分繼承或拋棄；遺囑無法對抗配偶剩餘財產請求權，因為遺產中一部分本質上不是被繼承人的。", "講義提醒很多男性老闆以為名下財產都是自己的，是嚴重迷思；剩餘財產請求權只是金錢債權，可由遺囑搭配壽險預留現金補償；配偶繼承權是分配遺產的物權，須透過遺囑將遺產所有權歸屬給子女，再預留壽險補償配偶應繼分、特留分。", "進階常識：剩餘財產請求權原是一身專屬權，不得讓與或繼承；但若有契約承諾或已起訴，則可讓與或繼承（案例中配偶生前已起訴，因此可繼承）；向國稅局主張扣除額與向法院起訴是各自獨立的權利行使；主張扣除額並取得完稅證明後，須在一定期間內把金額確實給付配偶，否則國稅局追回遺產稅。", "家族爭產進入訴訟，國稅局審核發單會拖很久，所有遺產與存款被凍結很久；開庭筆錄與卷宗會讓遺產曝光被追稅，漏報連補帶罰、遺產稅核課期間七年；案例中繼承人須主動申報境外資產（美國不動產信託、境外公司股權共5,776萬元）。", "遺產稅5,300萬無人願意墊繳（不一定拿得回來）；主要遺產為書局不動產與公司股權，不能實物抵繳，現金存款很少；拖著拖著本稅加滯納金與利息暴增為5,995萬元，為了這筆稅整個企業總部與公司股權被移送行政執行；講義說這讓集團接班計畫被徹底打亂。", "董事長死亡後須召開董事會改選，必要時股東會全面改選，再不行向法院申請臨時管理人；股份公同共有時行使股東權須全體同意；遺囑執行人可單獨辦理股權遺產分割；遺囑搭配壽險讓接班人立刻有現金，讓遺囑執行人繳清遺產稅、補償應繼分特留分並辦理分割過戶。", "進階場景：中小企業董事長突然死亡，員工薪資、廠商貨款、銀行貸款、客戶抽單、貸款加速到期、公帳私帳混用、個人名義持有企業總部或股權被移送執行；講義主張多數老闆死前不願交棒，不如好好為接班人準備壽險保額帳，受益人立刻領到倍數保額。"], "takeaways": ["提醒男性老闆：名下財產不全是自己的，夫妻剩餘財產分配要先算清楚。", "企業主案例以『5,300萬稅款拖成5,995萬、企業總部被執行』說明現金流準備的重要。"], "pdf": "pdf/20260618.pdf", "videos": [{"key": "20260618完整影片", "title": "完整影片", "url": ""}, {"key": "20260618第1段三民書局爭產故事", "title": "第1段　三民書局爭產故事", "url": ""}, {"key": "20260618第2段小心接班人是配偶", "title": "第2段　小心接班人是配偶", "url": ""}, {"key": "20260618第3段剩餘財產分配進階", "title": "第3段　剩餘財產分配進階", "url": ""}, {"key": "20260618第4段家族爭產凍結很久", "title": "第4段　家族爭產凍結很久", "url": ""}, {"key": "20260618第5段家族爭產遺產曝光", "title": "第5段　家族爭產遺產曝光", "url": ""}, {"key": "20260618第6段沒人墊繳移送執行", "title": "第6段　沒人墊繳移送執行", "url": ""}, {"key": "20260618第7段董座死亡改選風險", "title": "第7段　董座死亡改選風險", "url": ""}, {"key": "20260618第8段董座死亡進階風險", "title": "第8段　董座死亡進階風險", "url": ""}]}, {"date": "2026/06/04", "topic": "高額人壽保險成交心法", "thesis": "高額壽險的成交不在遺產稅爭辯，而在「一張保單，一世情」的終身服務與人品；以倍數保額、立刻領到，解決繼承現金流風險。", "points": ["講義提到提告國稅局行政訴訟實質勝訴率僅約0.3%；不要猜測國稅局，聚焦「倍數保額壽險」與「繼承現金流風險」，才有底氣向國稅局說明、對客戶有交代。", "五訪的迷思：客戶是先想跟你買，才會聽你講商品，不是先聽商品才想買；順序反了就很難等到客戶願意聽；情保、緣故保、打發保、恐懼保在高額壽險銷售都是行不通的，不要把傳統醫療、意外險、壽險的銷售邏輯套用到高額壽險。", "客戶挑選的是「終身服務的保險業務員」：做人永遠在處事之前，會做人不懂商品也可成交，不會做人再懂商品也不會成交；商品內容都一樣，由誰服務一輩子很不一樣；捧場、支持、照顧才是成交關鍵字。", "廣結善緣：參加社團、宗教志工的底層邏輯不在喝酒聚餐、稱兄道弟，多數只是浪費錢與時間；輕鬆自在說出「我是壽險業務員」，常常逗陣作伙、輕旅遊、有話講到沒話講，三不五時換你講話，就開講保險財富傳承的新聞案例故事。", "互惠原則：回報會因身分地位不同而差距巨大，高資產客戶的舉手之勞可能翻轉你的命運；顧問式銷售是裝模作樣，服務式銷售是幫忙解決困難到讓人感到欠情、想要回報，善緣自然成熟。", "善緣成熟時你可能只有五分鐘：說明「倍數保額」「立刻馬上領到」的獨特價值；範例：總繳3,000萬，6年後解約金大於總繳保費，保險金6,000萬以上；像買益生菌一樣，繳的錢都在，保險公司幫你出一倍。", "講義數字：114年度遺產稅總申報件數184,122件，免稅件數約93%，10%級距約6.1%、15%約0.5%、20%約0.4%；2025年繼承遺產總額約1兆2,000億，新契約壽險保費破1兆（傳統型約6,000億、投資型約4,000億），遺產稅約443億。", "繼承現金流場景：銀行存款被凍結，但房貸與生活費不會凍結；中小企業董事長突然死亡，員工薪資、廠商貨款、銀行貸款怎麼辦；可能觸發貸款加速到期（抽銀根）；個人存款瞬間被凍結、公司缺錢；多數老闆口說交棒接班，到死都不願放手，不如準備保額帳。"], "takeaways": ["練習在五分鐘內說清楚：倍數保額＋立刻領到＋誰是受益人，而不是講稅法。", "把『終身服務』說出口：這張保單會有我一輩子陪著你和家人。"], "pdf": "pdf/20260604.pdf", "videos": [{"key": "20260604完整影片", "title": "完整影片", "url": ""}, {"key": "20260604第1段告國稅局勝訴極低", "title": "第1段　告國稅局勝訴極低", "url": ""}, {"key": "20260604第2段一日五訪的迷思", "title": "第2段　一日五訪的迷思", "url": ""}, {"key": "20260604第3段終身服務業務員", "title": "第3段　終身服務業務員", "url": ""}, {"key": "20260604第4段高額保單翻轉人生", "title": "第4段　高額保單翻轉人生", "url": ""}, {"key": "20260604第5段倍數保額馬上領到", "title": "第5段　倍數保額馬上領到", "url": ""}, {"key": "20260604第6段遇過幾位破億客戶", "title": "第6段　遇過幾位破億客戶", "url": ""}, {"key": "20260604第7段存款凍結貸款不會", "title": "第7段　存款凍結貸款不會", "url": ""}, {"key": "20260604第8段中小企業董座死亡", "title": "第8段　中小企業董座死亡", "url": ""}]}, {"date": "2026/05/21", "topic": "高額人壽保險成交心法", "thesis": "遺產稅終究要繳，不必在稅法裡打轉；核心是協助客戶建立「立刻到位的倍數保額」，解決繼承現金流風險，並以真心喜歡、真心相信的態度與客戶開講。", "points": ["講義提醒：沒人能保證哪種高額壽險一定不計入遺產總額；如果最後還是要繳稅，鑽研遺贈稅法的意義是什麼？就像繳了多年所得稅也沒研究所得稅法；若只是要預留稅源，專注銷售倍數保額即可。", "實質課稅擴大解釋：被計入遺產總額時，就不用再受所得基本稅額每申報戶3,740萬免稅額的限制，超高額壽險可全力衝保額；3,000萬銀行存款本來就要課遺產稅，存入高額壽險帳反而可能不課，且倍數保額立刻可領、想給誰就保證給誰。", "亞洲資產管理中心新制度（講義介紹）：保費融資例如躉繳1億，第1年解約金80%（8,000萬）、銀行融資80%（6,400萬），第4年解約金1億、保額2億，利率2.6%、期滿審核續約；保單融資則以繳費期滿壽險的解約金為抵押，向銀行融資75%，參考利率2.38%。另提到研議百年信託制度（保險金信託匯入課徵一次遺產稅，受益人代代相傳不再課稅）。", "銷售思想：「先求有，再求好」，不要想一次到位，多少準備一點，分年分批準備也可以；壽險難賣是因為賣的是客戶永遠不想想到的東西，是深層的準備感、安全感與確定感，像出遠門關瓦斯。", "繼承現金流風險：從被繼承人死亡瞬間所有遺產（含銀行存款）被凍結；孩子手上要有夠多現金，銀行存款辦不到、壽險辦得到；講義舉建設公司老董到死不交代，子女繼承發現有60億土地資產、15億現金存款、25億銀行貸款。", "在客戶重病時才把財產過戶給配偶、子女不符合人性（老了、病了，敢一無所有嗎？）；6,000萬身故保險金或許無法一次解決問題，但能撐過遺產稅凍結的過程，現金爭取時間與空間；永不分家、百年家業只是一廂情願，子女繼承後多半會變現。", "個人真誠：講義主張「我真的很喜歡壽險」，只有發自內心喜歡的事才有內在驅動；分享連自己都不喜歡的遺產稅法、背一堆話術嚇客戶，會連開口都辦不到；讀書會的存在價值是與同學一起聚焦高額壽險的本分本業與專業底氣。", "共好與信念：講久了就有信徒；當別人真心相信我們在做一件好事，自然會想幫助我們成功；講者自己的KPI不是成交多少業績，而是每天反覆問同學：今天從醒來到睡覺，跟多少人開講、講故事，談「倍數保額的壽險」。"], "takeaways": ["問自己：我真正喜歡、真正相信的是什麼？用這個和客戶開講，比背話術有力。", "給客戶一個小步驟：先求有，分年分批準備遺產外現金。"], "pdf": "pdf/20260521.pdf", "videos": [{"key": "20260521完整影片", "title": "完整影片", "url": ""}, {"key": "20260521第1段遺產稅終究要繳", "title": "第1段　遺產稅終究要繳", "url": ""}, {"key": "20260521第2段不受限3740萬", "title": "第2段　不受限3740萬", "url": ""}, {"key": "20260521第3段保費融資保單融資", "title": "第3段　保費融資保單融資", "url": ""}, {"key": "20260521第4段人壽保險吃一輩子", "title": "第4段　人壽保險吃一輩子", "url": ""}, {"key": "20260521第5段人壽保險立刻領到", "title": "第5段　人壽保險立刻領到", "url": ""}, {"key": "20260521第6段賣掉變現孩子心願", "title": "第6段　賣掉變現孩子心願", "url": ""}, {"key": "20260521第7段本分本業專業底氣", "title": "第7段　本分本業專業底氣", "url": ""}, {"key": "20260521第8段講久了就有信徒", "title": "第8段　講久了就有信徒", "url": ""}]}, {"date": "2026/05/07", "topic": "第二任老婆的財富傳承", "thesis": "以「第二任老婆」為例，說明無遺囑時配偶與前婚子女共有不動產的風險；用公證遺囑、現金補償條款與壽險，讓存活配偶能繼續住在家裡並獲得保障。", "points": ["教學思想：越學越複雜，路就走偏；越學越簡單，路就走對；30個教過的場景反覆複習、多場景綜合演練、逐漸簡化核心思想；提醒不要貪圖便利、敗在AI手上，你賣的東西非常昂貴，沒有情感與溫度將什麼都不是；核心價值是「陪伴」。", "案例：老公A、第二任老婆B，與第一任妻子的兒子C、女兒D；若都沒處理，A死亡時所有遺產（含AB共同居住的家）由B、C、D公同共有；B沒有繼續居住的合法權利，除非全體共有人過半數同意，C、D可向B請求返還共有物並請求相當於租金的損害賠償。", "講義指出：真正對這間不動產有感情、有居住剛需的只有第二任老婆，前婚子女通常只想變現；共有人可隨時主張分割，無法協議時法院會變價分割拍賣，三拍64折，賣得價款再分成三份，B分到的錢往往不夠再買一間房。", "解法：透過公證遺囑，載明現金補償條款，將不動產所有權歸屬給存活配偶B，並將6,000萬保額指定受益人為B；有公證遺囑時，遺囑執行人完稅後可代理全體繼承人辦理不動產繼承過戶；遺囑侵害特留分仍有效，其他繼承人最多主張現金補償，特留分也可和解拋棄。", "遺體是遺產，屬公同共有，喪禮、火化、安葬要經繼承人過半數同意；因此一定要好好寫遺囑，指定遺囑執行人，載明全部後事並全權委託辦理。", "要求老公A生前就過戶不動產違反人性（老了、病了，敢一無所有嗎？）；壽險原始出廠設定符合人性：3,000萬解約金是客戶的，直到離世瞬間受益人立刻保證領到6,000萬；死守3,000萬不動產死亡時還是3,000萬，轉入壽險則倍數放大且沒有特留分限制、想給誰就給誰。", "保障第二任老婆的投保方式：要保人老公、被保險人老公、受益人老婆；坊間有教要保人老婆、被保險人老公、受益人老婆（無遺產稅無所得稅），但講義提醒若老婆先死，保價金會變成遺產由老公與兄弟姐妹繼承；若離婚，保價金是贈與財產但保本後孳息要分配，且被保險人可隨時終止同意權。", "夫妻一方死亡時先發生剩餘財產分配，繳完遺產稅後剩下的才是繼承遺產；存活配偶主張剩餘財產分配不需與其他繼承人分擔；剩餘財產請求權只是金錢債權，可由壽險預留現金補償；另可考慮「居住權信託」或遺囑信託讓配偶住到終老，但要申報遺產稅、其他繼承人仍可主張特留分扣減。"], "takeaways": ["以「配偶住的房子、前婚子女想變現」的對比，讓客戶自己看見風險，再談遺囑與壽險。", "與客戶談再婚家庭時，把『存活配偶能否繼續住下去』當成首要問題。"], "pdf": "pdf/20260507.pdf", "videos": [{"key": "20260507完整影片", "title": "完整影片", "url": ""}, {"key": "20260507第1段訂閱制讀書會思想", "title": "第1段　訂閱制讀書會思想", "url": ""}, {"key": "20260507第2段6千萬保額帳戶", "title": "第2段　6千萬保額帳戶", "url": ""}, {"key": "20260507第3段第二任老婆處境", "title": "第3段　第二任老婆處境", "url": ""}, {"key": "20260507第4段保護第二任老婆", "title": "第4段　保護第二任老婆", "url": ""}, {"key": "20260507第5段保護自己照顧別人", "title": "第5段　保護自己照顧別人", "url": ""}, {"key": "20260507第6段第二任的差別待遇", "title": "第6段　第二任的差別待遇", "url": ""}, {"key": "20260507第7段要受老婆被保老公", "title": "第7段　要受老婆被保老公", "url": ""}, {"key": "20260507第8段保護第一任子女", "title": "第8段　保護第一任子女", "url": ""}, {"key": "20260507第9段房子第二任住終老", "title": "第9段　房子第二任住終老", "url": ""}]}, {"date": "2026/04/23", "topic": "直球對決高額人壽保險", "thesis": "建立「6,000萬保額帳」，讓客戶一生保有完全主控權，離世瞬間由受益人立刻領到；並搭配公證遺囑保護在家照顧的子女，成交靠陪伴與關係而非辯論。", "points": ["訂閱制讀書會的方法：線上直播讀書會超過三十堂、分段回放超過百部，不必全部補課，跟上最新的就好；每次新場次是經典場景的反覆複習、細節延伸、時事驗證；提問的能力取決於文字表達能力，社群記事本有數百篇、數十萬字的普通常識文字解析可搜尋分享；核心價值是「陪伴」。", "6,000萬保額帳範例：年繳500萬、6年共繳3,000萬，解約金會大於等於總繳保費，保險金6,000萬以上；最多提撥3,000萬保費，解約金一直是自己的，離世瞬間受益人才領到6,000萬；完全的掌控權是高資產客戶的根本需求。", "6,000萬保額是受益人的財產，不是被繼承人的遺產，不受遺產稅凍結，保險公司只認身分證號碼，不看其他繼承人臉色，不用執行、沒有紛爭；講義說明保額是「保本領回3,000萬後，保險公司再給一倍」，不是想買多少就能買多少。", "保護在家照顧的子女：用公證遺囑加現金補償條款，將不動產所有權歸屬給在家照顧的子女，並指定其為6,000萬保額的受益人；有公證遺囑時，遺囑執行人完稅後可代理全體繼承人辦理不動產繼承過戶，不需其他繼承人簽名；遺囑侵害特留分仍有效，其他繼承人最多只能主張現金補償，特留分也可和解拋棄。", "講義強調：銷售壽險不要談報酬率，要談倍數保額；從被繼承人離世瞬間，孩子手上要有足夠現金，銀行存款辦不到、壽險辦得到；晚年適時簡化資產、從遺產內轉到遺產外，從理所當然轉為存感恩。", "遇到不孝子女，可把遺產內資產轉到遺產外壽險，降低遺產總額、應繼分與特留分；保額帳可隨時變更受益人；壽險是客戶晚年的醫療保障，緊急時可借款，剩下的再留給受益人。", "遺澤保單思想：講義提到陳樹菊阿嬤改捐壽險，受益人可為想照顧的人或慈善團體；捐現金後若後悔無法反悔，捐壽險可隨時變更受益人；保險金可分期給付保障三十年生活。", "國稅局實質課稅原則主軸是定額性（保費純粹購買保額）與互助性（集眾人之力分散風險）；講義提醒不要陷入與高資產客戶辯論的陷阱，要檢視自己對客戶是功能性、價值性還是意義性的存在，只談高額壽險、倍數保額保障本質與福慧傳家的圓滿智慧。"], "takeaways": ["用一張簡單的『6,000萬保額帳』示意圖，說明保本與倍數保額，不談報酬率。", "傳承規劃中把『在家照顧父母的子女』列為特別保護對象，遺囑與保險一併設計。"], "pdf": "pdf/20260423.pdf", "videos": [{"key": "20260423完整影片", "title": "完整影片", "url": ""}, {"key": "20260423第1段反覆學習複利力量", "title": "第1段　反覆學習複利力量", "url": ""}, {"key": "20260423第2段6千萬保額帳戶", "title": "第2段　6千萬保額帳戶", "url": ""}, {"key": "20260423第3段保護照顧父母子女", "title": "第3段　保護照顧父母子女", "url": ""}, {"key": "20260423第4段孩子知道哪裡用錢", "title": "第4段　孩子知道哪裡用錢", "url": ""}, {"key": "20260423第5段抱怨分太少等太久", "title": "第5段　抱怨分太少等太久", "url": ""}, {"key": "20260423第6段陳樹菊捐人壽保險", "title": "第6段　陳樹菊捐人壽保險", "url": ""}, {"key": "20260423第7段講到底是關係不夠", "title": "第7段　講到底是關係不夠", "url": ""}]}, {"date": "2026/04/09", "topic": "傳承主流高額人壽保險", "thesis": "回到壽險的「原始出廠設定」：要保人與被保險人同一人、受益人具名指定想照顧的人，以保本且倍數保額的主流傳承保單直球對決，解決繼承風險。", "points": ["原始出廠設定：要保人、被保險人同一人，受益人具名指定內心想要照顧的人；主流傳承保單為高額壽險中的利變型與分紅型保單。", "範例：年繳500萬、6年共繳3,000萬，宣告利率與分紅實現率都達標，解約金保本，保險金6,000萬以上；3,000萬保本解約活著都是客戶的，身故瞬間受益人立刻領到6,000萬，想給誰就給誰。", "客戶常問：為何6年後解約金才保本、保額才跳2倍以上？講義解釋是緩解被保險人與保險公司的風險、因應高齡化而放寬體況要求；即使6年累積期內離世，保額仍高於保費。", "宣告利率與分紅實現率都不是保證的（講義以0050也不保證作比喻）；建議把保險公司網站公告的各年度宣告利率、分紅實現率列印給客戶看；分紅型有終期分紅，利變型有平穩結餘調節項（類似保留盈餘）。", "客戶說「要繳遺產稅就不買」：另一個劇本是什麼都不買、現金放銀行，銀行存款也是遺產、也會被凍結；壽險是受益人領取的財產，不是被繼承人的遺產，不被遺產稅凍結。", "「預留稅源」這句話不要再說：存款、股票、不動產都被遺產稅凍結；未繳清前不得分割遺產、交付遺贈、辦理移轉登記；欠稅時全體繼承人、全部遺產移送強制執行；真正風險是從死亡瞬間所有遺產被凍結，哪怕只要繳10萬。2025年台灣死亡人數20.2萬，僅約6.4%（約1.3萬人）需繳遺產稅。", "繼承風險場景：大研生醫董事長47歲驟逝，涉及遺產稅申報程序、股票質押維持率130%、豪宅房貸、未成年女兒生活、老父老母老年生活、企業經營權；替子女買房成家的雙保險智慧，指定扛房貸的子女為受益人。", "客戶說有會計師、律師事務所，為何需要你？講義認為窮盡背下整部遺贈稅法也不會成交；高資產客戶忌諱談死、光寫遺囑就掙扎，壽險的優點是客戶活著時所有錢都還是他的、可隨時變更受益人，是隱形金庫與晚年醫療保障。"], "takeaways": ["準備一頁列印的宣告利率與分紅實現率資料，主動讓客戶看見數字與不保證的事實。", "遇到客戶說已預留稅源，溫和提問：這些錢在遺產稅繳清前能不能動用？"], "pdf": "pdf/20260409.pdf", "videos": [{"key": "20260409完整影片", "title": "完整影片", "url": ""}, {"key": "20260409第1段人壽保險原始設定", "title": "第1段　人壽保險原始設定", "url": ""}, {"key": "20260409第2段利變分紅保單問答", "title": "第2段　利變分紅保單問答", "url": ""}, {"key": "20260409第3段預留稅源誤解很深", "title": "第3段　預留稅源誤解很深", "url": ""}, {"key": "20260409第4段遺產稅真正的風險", "title": "第4段　遺產稅真正的風險", "url": ""}, {"key": "20260409第5段大研生醫董座驟逝", "title": "第5段　大研生醫董座驟逝", "url": ""}, {"key": "20260409第6段替子女買房雙保險", "title": "第6段　替子女買房雙保險", "url": ""}, {"key": "20260409第7段客戶到死不會交代", "title": "第7段　客戶到死不會交代", "url": ""}]}, {"date": "2026/03/26", "topic": "圓滿遺產分配的三部曲", "thesis": "繼承人有外債、遺囑與孫輩傳承、替子女買房等情境，都可用「公證遺囑＋現金補償條款＋壽險」的三部曲處理；同時說明公證遺囑為何比自書遺囑加認證穩固。", "points": ["繼承人有鉅額負債：被繼承人預立遺囑將遺產全分給其他繼承人、或繼承人達成遺產分割協議、或不處理維持公同共有，債權人都可代位行使特留分扣減權、撤銷分割協議或提起分割訴訟。", "釜底抽薪的作法是「拋棄繼承」，債權人無法對拋棄繼承主張權利；但若錯過三個月期限，遺囑執行、分割協議、分割訴訟都可能把外部債權人扯進來。", "可透過高額壽險讓受益人立刻拿到遺產外現金，補償負債繼承人、交換其拋棄繼承；不建議受益人直接填負債繼承人；也可由公證遺囑把家業歸屬其他繼承人，並限縮為對負債繼承人特留分的現金補償；被繼承人也可生前轉入遺產外壽險、降低遺產總額與特留分。", "替子女買房：頭期款、裝潢後留貸款讓年輕人繳，承擔責任；父母偷偷再買高額壽險，受益人填寫扛房貸的子女，離世時一次還清房貸（雙保險的智慧）。講義算例：房貸6,000萬若靠提撥需拿出6,000萬現金，但買壽險只需提撥3,000萬，其餘由保險公司分攤，且不受遺產稅凍結、不需其他繼承人同意。", "隔代傳承：講義以向華強2,000億遺產不留給兒子而傳給孫子的新聞為例，說明第二代可能缺乏教育、揮霍；用遺囑搭配壽險，將家業歸屬孫子，載明現金補償條款，由孫子與受益人以壽險現金補償兒子特留分，主張「福慧傳家」。", "公證遺囑與自書遺囑加認證：自書遺囑須全文自書、記明年月日並簽名，公證認證本質上仍是自書遺囑，頂多證明簽名是真的；最高法院108台上444判決，自書遺囑忘記填年月日、即使認證有記載，遺囑仍無效；無錄影、無見證人時，遺囑人的認知狀態常成訴訟爭點（張榮發遺囑案打了八年）。", "公證遺囑須二位以上見證人在場，由遺囑人親口陳述遺囑意旨，不得以點頭、搖頭表達；公證人會永久留存繕本，降低保管與執行風險。講義提醒：繼承無法重來，公證遺囑雖麻煩，卻最嚴謹。", "數字提醒：2025年台灣死亡人數20.2萬，僅約6.4%（約1.3萬人）要繳遺產稅，超過90%的家庭有繼承風險；遺產稅真正的風險是遺產凍結後的現金風險，講義建議不要再說「預留稅源」，因為存款、股票、不動產都會被凍結。"], "takeaways": ["遇到子女有債務的家庭，先釐清拋棄繼承期限與現金補償安排，不要建議受益人直接填負債繼承人。", "替子女買房情境，以「雙保險」概念談：生前扶持、離世時一次還清房貸。"], "pdf": "pdf/20260326.pdf", "videos": [{"key": "20260326完整影片", "title": "完整影片", "url": ""}, {"key": "20260326第1段子女負債繼承風險", "title": "第1段　子女負債繼承風險", "url": ""}, {"key": "20260326第2段替子女買房雙保險", "title": "第2段　替子女買房雙保險", "url": ""}, {"key": "20260326第3段向華強隔代傳承案", "title": "第3段　向華強隔代傳承案", "url": ""}, {"key": "20260326第4段自書遺囑加公證人", "title": "第4段　自書遺囑加公證人", "url": ""}]}, {"date": "2026/03/12", "topic": "大研生醫董事長驟逝案", "thesis": "以大研生醫董事長47歲驟逝的新聞為場景，說明繼承風險不只遺產稅，還包括股票質押維持率、房貸、未成年子女與經營權；高額壽險是立刻到位的遺產外現金。", "points": ["新聞場景（講義內容）：大研生醫董事長在美出差睡夢中驟逝，享年47歲，育有未成年女兒、另有已離婚前妻；其持有尚凡國際22.41%股權，粗估市價約19億元。", "講義記錄股價反應：消息後尚凡國際單日跌幅8.61%、大研生醫跌幅7.88%，當天持有股權市值蒸發約1.65億元。", "股票質押風險：講義列出質押比率60.87%；擔保維持率＝目前總市值／借款金額，低於130%會被追繳（市值100萬、借60萬，初始維持率約166%，追繳線為78萬）；須補錢、降低借款或補質押股票，否則可能斷頭。", "遺產稅未完稅前所有遺產被凍結，如何補錢、補股票？跑完整個遺產稅流程早就被斷頭了；上市公司大股東主要資產為股權，通常會質押開槓桿，存在巨大繼承風險；壽險預留給受益人立刻拿到的現金，可補錢提高維持率、化解追繳。", "其他風險：豪宅若仍有貸款，房貸不會因辦喪事而停扣；新創公司創辦人突然離世，其他股東是否讓孤兒寡母接班、經營權與出清價格都是問題；唯一繼承人未成年女兒，法定代理人是前妻。", "高齡父母沒有任何繼承權利，誰扶養、怎麼扶養？可為老父老母投保高額壽險、受益人為父母；已離婚並育有未成年子女者，可投保高額壽險，受益人填寫祖父母以確保照顧未成年子女。", "銷售誤區：不要想學一個絕招講出來客戶就發抖簽單；縱使客戶想買也不一定跟你買，結婚生子、買壽險都是終身服務；壽險是成熟商品，找對場景、對的人、對的商品，以「出廠設定」成交。", "講義主張：讀書會專注壽險專業底氣，輕鬆學各種成交場景的普通常識跟客戶開講，其餘90%學習做人處事，成為願意存善念、利益無數活著的人的一個簡單的好人。"], "takeaways": ["以真實新聞為話題，引導客戶思考「如果是我明天離開，股票、房貸、公司、家人各怎麼辦」。", "對持股質押的客戶，可從『維持率與凍結期間誰來補錢』切入。"], "pdf": "pdf/20260312.pdf", "videos": [{"key": "20260312完整影片", "title": "完整影片", "url": ""}, {"key": "20260312第1段遺產稅全過程風險", "title": "第1段　遺產稅全過程風險", "url": ""}, {"key": "20260312第2段股票質押維持風險", "title": "第2段　股票質押維持風險", "url": ""}, {"key": "20260312第3段遺留高額房貸風險", "title": "第3段　遺留高額房貸風險", "url": ""}, {"key": "20260312第4段股票無法變現風險", "title": "第4段　股票無法變現風險", "url": ""}, {"key": "20260312第5段老父母未成年風險", "title": "第5段　老父母未成年風險", "url": ""}, {"key": "20260312第6段理賠保險金的感受", "title": "第6段　理賠保險金的感受", "url": ""}]}, {"date": "2026/02/26", "topic": "服務式行銷會成交業績", "thesis": "高額壽險不是為了遺產稅而存在，而是為了解決「繼承風險」，在風險發生瞬間讓受益人立刻拿到遺產外現金；成交靠服務、陪伴與善緣，而不是套路話術。", "points": ["「財富傳承」聽起來太中性美好，繼承的本質是風險；很多高資產客戶用活著時的能力去看繼承風險，但繼承發生時被繼承人已經不在，子女有沒有能力與氣力面對國稅局糾纏與家族爭產？", "繼承風險不是數字遊戲，法律訴訟程序非常殘酷，很多行銷話術理論正確、實務危險；講義主張放掉架構與話術，好好講個故事、解析新聞故事與普通常識，關注高額壽險能幫上什麼忙。", "不要學套路、話術客戶：背整套銷售流程可能就是一直沒成交的病根；客戶有繼承風險、有保險需求，不代表現在手上就要投保，要練習蓄積善緣、耐心等待；善緣成熟也不代表客戶就想跟你買，你是客戶心中的「那個人」嗎？", "顧問式銷售是某種逃避、窮忙後的安慰；保險商品經過保險公司精算、保險局核准，業務員是銷售服務人員，客戶永遠覺得是他們讓我們賺錢，要以行動感恩；回歸服務式銷售，客戶想到保險想到你、想到服務想到你。", "高額壽險不必在「免稅」問題上與客戶糾纏，因為沒有人能給出確定、保證的答案；存款、股票、不動產都要繳稅客戶仍願意買，不買的錢還是要繳稅。", "講義數字：全台灣不到6%的人要繳遺產稅，也不一定繳很多；超過90%的人都有繼承風險，這才是真正的剛需；遺產稅只是繼承風險的一種，遺產外現金可撐過申報過程、補償應繼分與特留分、清償不動產貸款、照顧想照顧的人。", "訂閱制讀書會的定位：每次線上直播、提問的完整文字解析、即時新聞故事議題、Podcast，像訂閱影音平台，不強迫追完、不逼補課；核心價值是「陪伴」與「善念實驗」，不分別心、老實做事，成為一個簡單的好人。", "提醒：高額壽險跟一棟豪宅差不多貴，需要埋下種子、持續灌溉；眼前的客戶不是客戶，是傳遞普通常識的有緣人，不用執著要成交眼前的人，重要的是不斷持續種下善緣種子。"], "takeaways": ["談話從繼承風險出發，用新聞或身邊故事，而不是從稅法條文出發。", "把「陪伴」放在成交之前：持續提供有價值的普通常識，等善緣成熟。"], "pdf": "pdf/20260226.pdf", "videos": [{"key": "20260226完整影片", "title": "完整影片", "url": ""}, {"key": "20260226第1段繼承本身就是風險", "title": "第1段　繼承本身就是風險", "url": ""}, {"key": "20260226第2段不學套路話術客戶", "title": "第2段　不學套路話術客戶", "url": ""}, {"key": "20260226第3段本分本業賣保險", "title": "第3段　本分本業賣保險", "url": ""}, {"key": "20260226第4段服務式行銷會成交", "title": "第4段　服務式行銷會成交", "url": ""}, {"key": "20260226第5段保險業務價值初心", "title": "第5段　保險業務價值初心", "url": ""}, {"key": "20260226第6段一個簡單的好人", "title": "第6段　一個簡單的好人", "url": ""}, {"key": "20260226第7段煩惱服務善緣業績", "title": "第7段　煩惱服務善緣業績", "url": ""}]}, {"date": "2026/02/05", "topic": "藝術品的財富傳承", "thesis": "實物抵繳、銀行保管箱與藝術品傳承都不如想像中簡單；講義提醒高資產客戶應聚焦「立刻拿到的遺產外現金」，而不是複雜議題。", "points": ["實物抵繳：只能就現金不足部分申請，任何遺產包含存款都要取得繼承人過半數同意；不動產以公告現值抵繳不划算、不易變價者按比例抵繳；超過部分的退還計算與變價時間（可能經歷多次拍賣降價）都很漫長，走到實物抵繳已是某種程度的末路。", "未上市公司股權以淨值抵繳，國稅局幾乎認定為不易變價遺產，只能比例抵繳；標售流程拍賣多次後，新股東是誰也是風險；市場定位不是上市櫃公司董事長，而是數量龐大的中小企業主。", "中小企業主離世，最麻煩的不只是遺產稅稅源，而是需要足夠撐過申報遺產稅過程的、立刻拿到的遺產外現金；董事會不能行使職權時，法院可依利害關係人聲請選任臨時管理人。", "銀行保管箱：把金條、珠寶、名錶藏在保管箱無法規避遺產稅，必須會同國稅局開啟、開立財產清冊，才能完成申報；須在六個月期限內主動申請，若箱內有一份遺囑「就中獎了」。", "藝術品稅務（講義列示）：經文化部認可的文化藝術事業在境內展覽、拍賣，按成交價格6%×20%＝1.2%分離課稅；非認可者按成交價格6%併入綜合所得；海外拍賣藝術品以成交價格20%列入海外所得，課徵所得基本稅額。", "文化、歷史、美術圖書物品經繼承人向國稅局聲明登記者不計入遺產總額，但轉讓時仍須主動申報補稅，只有延後課稅的效果；超高價藝術品若未聲明登記就是漏報，曾有保險、拍賣、分割訴訟紀錄也會曝光。", "講義以國巨陳泰銘、奇美許文龍等例子說明：超高價藝術品不是價高者得，要看是否夠格承擔傳承；留超高價藝術品比留不動產更麻煩，適時隨緣變現，留下壽險，並透過遺囑搭配壽險明確畫作所有權歸屬，真正有錢的人最後常捐贈公益。", "銷售心法：不要跟客戶講「家族辦公室、家族憲章、閉鎖型公司、信託架構」等高端議題，聽起來精彩但不會成交；聚焦當一位高額壽險專家，開誠布公表達想成交的期望，請客戶給一次服務的善緣。"], "takeaways": ["談實物抵繳時，點出「變現慢、不確定」的風險，再帶到預留遺產外現金。", "遇到客戶有藝術品或保管箱，提醒如實聲明與申報，並以誠懇的服務為主，不拿複雜架構炫技。"], "pdf": "pdf/20260205.pdf", "videos": [{"key": "20260205第1段實物抵繳不划算", "title": "第1段　實物抵繳不划算", "url": ""}, {"key": "20260205第2段未上市股票抵繳", "title": "第2段　未上市股票抵繳", "url": ""}, {"key": "20260205第3段銀行保管箱課稅", "title": "第3段　銀行保管箱課稅", "url": ""}, {"key": "20260205第4段客戶喜歡買藝術品", "title": "第4段　客戶喜歡買藝術品", "url": ""}, {"key": "20260205第5段藝術品繼承風險", "title": "第5段　藝術品繼承風險", "url": ""}, {"key": "20260205第6段夠格談家族辦公室", "title": "第6段　夠格談家族辦公室", "url": ""}]}, {"date": "2026/01/22", "topic": "頂客族夫妻財富傳承", "thesis": "頂客族（無子女夫妻）一方離世，存活配偶會瞬間與對方兄弟姐妹共同繼承；要用公證遺囑、現金補償條款與高額壽險，提前保護存活配偶。", "points": ["新聞情境：頂客族老公過世，叔叔分走2,000萬房產，還讓老婆獨自繳清遺產稅、代書費與規費；講義提醒兄弟姐妹有些是仇、有些是陌生人。", "法定繼承順序：配偶外，第一順位直系血親卑親屬、第二順位父母、第三順位兄弟姐妹、第四順位祖父母；配偶與第一順位均分，與第二、第三順位時配偶應繼分為遺產的二分之一，與第四順位為三分之二。即使未來刪除兄弟姐妹特留分，第三順位繼承權仍在，只有合法遺囑才能排除。", "遺產稅是公法上連帶債務，每位納稅義務人都要負繳納全部遺產稅的責任；若欠稅被移送強制執行，原則上只執行被繼承人遺產，包含配偶賴以居住的房子；兄弟姐妹擺爛，配偶只能獨自繳清；遺產稅完稅後，不敢與叔叔姑姑共有，其他棟也可能被分割拍賣。", "圓滿三部曲：第一步預立公證遺囑，將全部遺產分配給存活配偶；第二步在遺囑中載明對兄弟姐妹六分之一特留分的現金補償條款；第三步將被繼承人現金（必要時創造不動產負債）投保高額壽險，降低遺產總額，也降低應繼分與特留分。", "講義提醒：特留分與應繼分的計算與遺產稅申報價值無關，土地不是公告現值、房屋不是評定現值，一律以市價計算；遺產總額不等於遺產淨額，扣除喪葬費、遺產稅、不動產貸款後才計算特留分；夫妻一方死亡先處理剩餘財產差額分配請求權。", "千萬不要拿印章存摺去動被繼承人的存款，可能涉及偽造文書罪；死亡前二年內贈與配偶要列入遺產總額（擬制遺產），如實申報即可；頂客族夫妻要記得互保，不要只保一邊。", "不動產與投資型保單：兩間以上不動產不處理就變共有，除賴以居住的房子外適時變現、轉入高額壽險；投資型保單要課遺產稅是不專業說法，投資帳戶列入遺產，保險帳戶（定額倍數保額）獨立判斷是否違反實質課稅原則；利變型與分紅型本質上仍是傳統保障型。", "超高額規劃（講義範例）：躉繳1億保費、解約金8,000萬、銀行貸款6,400萬，備款3,600萬，第4年期滿保本、保額2倍，即2億元遺產外現金；躉繳商品現在著重保障，第6年才保本、跳2倍以上保額；講義強調賣壽險講「倍數遺產外現金」而非投資報酬率。"], "takeaways": ["頂客族客戶先問：「如果你先走，另一半要和誰一起分你的房子？」再導入遺囑與保險規劃。", "夫妻互保是簡單、可立刻行動的第一步。"], "pdf": "pdf/20260122.pdf", "videos": [{"key": "20260122完整影片", "title": "完整影片", "url": ""}, {"key": "20260122第1段配偶兄弟姊妹繼承", "title": "第1段　配偶兄弟姊妹繼承", "url": ""}, {"key": "20260122第2段壽險保護生存配偶", "title": "第2段　壽險保護生存配偶", "url": ""}, {"key": "20260122第3段壽險保護自己", "title": "第3段　壽險保護自己", "url": ""}, {"key": "20260122第4段投資型保單遺產稅", "title": "第4段　投資型保單遺產稅", "url": ""}, {"key": "20260122第5段利變分紅型遺產稅", "title": "第5段　利變分紅型遺產稅", "url": ""}, {"key": "20260122第6段亞資中心高額壽險", "title": "第6段　亞資中心高額壽險", "url": ""}, {"key": "20260122第7段人壽保險談倍數", "title": "第7段　人壽保險談倍數", "url": ""}]}, {"date": "2026/01/08", "topic": "高資客戶保護自己晚年", "thesis": "與其鑽研複雜的節稅架構，不如接受「終究要繳稅」，維持遺產單純、如實申報，並用高額壽險預備遺產外現金，先保護客戶自己的晚年，再談傳承。", "points": ["講義提醒：每年都繳所得稅卻沒鑽研所得稅法，為何要鑽研遺贈稅法？越學越艱深，路反而越走越偏；遺產稅六個月內申報、等待國稅局審核發單、二個月內繳納，逾期每三天罰1%滯納金，三十天後送強制執行。", "繼承人經得起多久？國稅局遲遲未審核稅單時，不動產貸款、現金開銷、公司經營權與股權行使都會卡關；申報遺產稅的整個過程本身就是家庭的重大風險，手上有現金很重要。", "沒事不要驚擾國稅局：作聰明的稅務安排架構，國稅局起疑後會警覺、狩獵，客戶就麻煩了；任何漏報（境外存款、境外公司股權、境外保單、海外不動產、台商在中國的資產）被抓到連補帶罰，貼上「逃漏稅」標籤是災難。", "講義主張簡單才是終極智慧：適當時機變現、維持遺產單純，聚焦準備遺產外現金，撐過整個遺產稅申報過程；繳納遺產稅三種稅源為繼承人的錢、被繼承人的遺產、壽險（遺產外現金）。", "高額壽險可讓保險公司幫忙分攤本來就要繳的遺產稅，分攤多少取決於年齡體況，越早買分攤越多；即使違反實質課稅原則被列入遺產總額，也只是擬制遺產，壽險依舊不是遺產。講義也提醒：宣告利率試算與分紅實現率不保證。", "講義數字：只有約6%的人要繳遺產稅，可能也只繳一點點；超過90%的人有繼承傳承分配的風險，這才是剛需；高額壽險是為了所有人存在，保護風險事故發生的家庭。", "高資產客戶先保護自己的晚年，其次才是傳承分配；講義批評慫恿客戶生前贈與的唯一好處是降低遺產總額、其餘都是風險；法定繼承順序為配偶外第一順位直系血親卑親屬、第二順位父母、第三順位兄弟姐妹、第四順位祖父母。", "要保人、被保險人、受益人排列：若要保人為子女，確實有稅務優勢但無法阻止子女解約，錢一轉手就變遺產；講義建議只聚焦符合保險本質的規劃（保本、主控權、遺產外現金），由自己當要保人與被保險人、保留彈性變更受益人，並作為晚年醫療保障與捐贈累積福報的工具。"], "takeaways": ["把話題從「節稅」轉成「遺產稅申報這段期間，家人手上有沒有現金可用」。", "詢問客戶：現在名下的錢，是否先保護自己的晚年，再決定傳承給誰。"], "pdf": "pdf/20260108.pdf", "videos": [{"key": "20260108完整影片", "title": "完整影片", "url": ""}, {"key": "20260108第1段遺產稅過程大風險", "title": "第1段　遺產稅過程大風險", "url": ""}, {"key": "20260108第2段創造遺產外現金", "title": "第2段　創造遺產外現金", "url": ""}, {"key": "20260108第3段高額人壽保險專家", "title": "第3段　高額人壽保險專家", "url": ""}, {"key": "20260108第4段保護晚年傳承分配", "title": "第4段　保護晚年傳承分配", "url": ""}, {"key": "20260108第5段主控權遺產外現金", "title": "第5段　主控權遺產外現金", "url": ""}]}, {"date": "2025/12/18", "topic": "中小企業主財富傳承", "thesis": "中小企業主的傳承風險在於股權與經營權：繼承人一喬不攏，公司可能停擺或易主；講義用遺囑與壽險預留遺產外現金，先把稅與補償處理好。", "points": ["繼承是事實行為，被繼承人死亡時公司股權即為繼承人所有；遺產稅未繳清前不得分割遺產、辦理股權過戶，但因已是股東，仍可行使表決權、領取股利（依法課所得稅）。", "董事長、董事職位不是可繼承的財產（與公司為委任關係，死亡即消滅）；董事長死亡時先由董事互推暫時代行，董事會應由三分之二以上董事出席、出席董事過半數同意互選董事長；董事缺額達三分之一時召開股東臨時會補選。", "董事選舉採累積投票制，每股有與應選董事人數相同的選舉權，可集中或分配；股份由數人共有時，應推定一人行使股東權；公同共有的股份，需全體同意才能行使，只要有一位繼承人不同意就無法出席股東會、行使表決權。", "繼承人無法協議分割而由法院裁判分割，股權可能分散，只要有繼承人投靠敵方，董事長就可能換人；遺囑執行人可單獨辦理股權遺產分割。", "講義解法：以遺囑將股權明確分配、最好集中給一人，搭配壽險預留鉅額遺產外現金，讓遺囑執行人立刻繳清遺產稅、辦理分割與移轉登記，並補償其他繼承人的應繼分與特留分。", "外籍配偶與子女：夫妻一方死亡先發生剩餘財產分配，繳完遺產稅後剩下的才是遺產；存活配偶主張剩餘財產分配不需與其他繼承人分擔，仍可再以繼承人身分繼承或拋棄。", "講義說明：中國籍配偶、子女繼承賴以居住的不動產受限，子女有200萬限額、配偶無200萬限額但未取得長期居留權時，都需折算現金；越南籍配偶、子女因無平等互惠原則不能取得不動產所有權，但仍有完整繼承權，須全部折算現金。解法是遺囑搭配壽險，將不動產歸屬台灣籍繼承人，由其取得壽險後補償外籍繼承人。", "成交心法：講義提醒研究遺產稅法也避免不了要繳，不如聚焦準備遺產稅源（繼承人的錢、被繼承人遺產、遺產外現金）；能用故事跟客戶「開講」就好，並反覆演練真實故事。"], "takeaways": ["對企業主，先問「股權要交給誰、誰能立刻出現金補償其他人」，再談保額。", "遇到外籍配偶或子女，早點把『折算現金補償』放進規劃，避免不動產被迫變價分割。"], "pdf": "pdf/20251218.pdf", "videos": [{"key": "20251218完整影片", "title": "完整影片", "url": ""}, {"key": "20251218第1段中小企業繼承風險", "title": "第1段　中小企業繼承風險", "url": ""}, {"key": "20251218第2段外籍配偶子女繼承", "title": "第2段　外籍配偶子女繼承", "url": ""}, {"key": "20251218第3段高額人壽保險心法", "title": "第3段　高額人壽保險心法", "url": ""}]}, {"date": "2025/12/04", "topic": "遺囑搭配人壽保險專題", "thesis": "遺囑決定遺產的歸屬，壽險提供不受執行與爭議影響的現金；「公證遺囑＋現金補償條款＋壽險」是圓滿分配的三部曲，並應指定律師為遺囑執行人。", "points": ["遺囑的強大功能在決定各項遺產的所有權歸屬，這是壽險做不到的；現金則可由資產變現、舉債變現或轉存壽險，因為遺囑要執行常有紛爭，壽險不用執行，還能倍數放大保額。", "建議使用公證遺囑，具公文書效力、可順利執行；由律師撰寫草稿並指定律師為遺囑執行人，再由公證人公證，最後由律師保管遺囑。繼承人不得為遺囑見證人，雖可擔任遺囑執行人，但幾乎會有紛爭。", "遺囑執行人是全體繼承人的代理人，有遺囑執行人時可無須徵得繼承人同意與法院核准而處分不動產；其職責包含繳納遺產稅、申請實物抵繳、特留分補償、應繼分找補、分割遺產與移轉登記。若未指定，可由親屬會議選定或聲請法院指定。", "務必準備高額壽險，才能提高有經驗的好律師擔任遺囑執行人的意願，降低律師費。", "遺囑要預留特留分的補償，否則受侵害的繼承人可向取得遺產者主張扣減權；補償可透過遺囑搭配壽保險、以遺產外現金完成；遺贈可附停止條件，須先完成補償與找補，遺贈才生效。", "講義提醒：壽險保險金不屬於遺產，縱使在遺囑中載明由特定繼承人取得作為特留分補償，也不生補償效力（遺贈中不屬於遺產的部分無效）；受益人須直接填寫取得遺產的人。", "中小企業老闆突然離世，留給家人的可能是一無所知、不值錢的公司；講義提醒下一代未必想接班，最關注的是能否變現，倍數放大的壽險是「放過彼此」的智慧與慈悲；遺囑內容可慢慢想，但保險要先買起來。", "銷售心法：境外資產、境外保單會不會被課稅，不要跟客戶辯論，辯贏了客戶也不會買；知道就說知道、不知道就說不知道，設定「能力圈」；成交最終關鍵在關係的深度與無意識的情緒價值，捧場、支持、照顧才是成交關鍵字。"], "takeaways": ["提出三部曲時，記得補一句「指定律師為遺囑執行人」，讓執行面有人負責。", "客戶丟來艱深法律問題時，坦然說不知道並轉介專業，反而建立可信度。"], "pdf": "pdf/20251204.pdf", "videos": [{"key": "20251204完整影片", "title": "完整影片", "url": ""}, {"key": "20251204第1段遺囑執行人重要性", "title": "第1段　遺囑執行人重要性", "url": ""}, {"key": "20251204第2段遺產分配三部曲", "title": "第2段　遺產分配三部曲", "url": ""}, {"key": "20251204第3段中小企業繼承風險", "title": "第3段　中小企業繼承風險", "url": ""}, {"key": "20251204第4段高額人壽保險心法", "title": "第4段　高額人壽保險心法", "url": ""}]}, {"date": "2025/11/20", "topic": "保單強制執行專題", "thesis": "「保單強制執行」不能籠統而談，要先分清誰是債務人、哪一種權利被扣押；講義整理了新法下解約金的保護額度、扣押命令效力與實務應對。", "points": ["保險業務員本分本業是賣保險：以最低保費創造最高保額、最好盡快保本；其他法律知識只要懂最少必要的普通常識，夠跟客戶「開講」就好。", "要保人為債務人：壽險各有效契約解約金，未超過每人每月最低生活費1.2倍計算6個月的金額（講義列2025年全國最高標準台北市為146,729元）者，不得扣押、強制執行；各有效契約分別計算；年金保險累積期比照，進入給付期則不得解約、不得強制執行。", "解約金超過146,729元時，不是只扣超過的部分，而是全部解約金可被扣押、強制解約；政府公告基本保障政策的保險（如終老保險）解約金不得強制執行；健康險與傷害險解約金不得強制執行，主約被終止時附約不得終止。", "受益人為債務人：保險金（健康險、傷害險）與進入給付期間的年金，不在新法禁止強制執行範圍內；介入權制度可由配偶、子女等經同意並給付預估解約金後變更為新要保人。", "扣押命令效力：只及於命令送達時已存在、已確定可領取的債權（如預估解約金、投資型保單帳戶價值、已得請領的保險金）；不及於尚未發生的將來一次性給付，但及於已確定可領取的繼續性給付（分紅、生存金、年金）。", "維持債務人及共同生活親屬生活所必需，以當地區每人每月最低生活費1.2倍計算的金額不得強制執行；講義列114年各縣市標準，例如臺北市20,379×1.2＝24,455元、新北市20,280元；繼續性債權（如年金）不得逾各期給付三分之一，若有失公平，法院不受限制。", "實務應對：法院發扣押令後、正式終止契約前，債務人有陳述意見機會，可提出等值於預估解約金的現金與債權人協商，撤回強制執行；但在將受強制執行之際變更要保人，有構成刑法損害債權罪的風險，債權人也可撤銷該無償行為。", "傳承面：被繼承人遺留鉅額負債時，受益人拋棄繼承後依然可以領取壽險；保本3,000萬解約、借款本息在保價金範圍內，不用說明用途、不用證明還款能力，隨借隨還、按天計息；不動產變現慢，壽險解約、變更、貸款擁有極速變現性。"], "takeaways": ["談保單債務保護時，先問清楚「誰是債務人、被扣押的是哪一項權利」，再用數字說明。", "有負債風險的客戶，提醒不要在受強制執行前臨時變更要保人，應事前規劃。"], "pdf": "pdf/20251120.pdf", "videos": [{"key": "20251120完整影片", "title": "完整影片", "url": ""}, {"key": "20251120第1段保單強制執行修法", "title": "第1段　保單強制執行修法", "url": ""}, {"key": "20251120第2段中小企業繼承風險", "title": "第2段　中小企業繼承風險", "url": ""}]}, {"date": "2025/11/06", "topic": "顧問式行銷的迷思", "thesis": "顧問式行銷容易讓業務員越學越複雜、忘了本業；講義主張回到「服務式行銷」，把本分本業放在賣保險，用「預留遺產稅源」作為簡單有力的傳承談話主軸。", "points": ["遺產稅提醒：六個月內申報、二個月內繳納，逾期每三天罰1%滯納金，三十天後送強制執行；未繳清前不得分割遺產、移轉登記，也不能動用遺產貸款或出售。", "遺產稅課徵標的包含境內境外全部遺產；境外資產、境外公司股權、境外保單、台商在中國的資產、股東往來債權、借名登記的股權與不動產，漏報被抓到都是連補帶罰。", "遺產稅是公法上的連帶債務，每位納稅義務人都負繳納全部的責任；講義列出欠稅達100萬有脫產跡象、達300萬頻繁出國、達1,000萬可直接限制出境。", "講義主張：與其研究一輩子節稅、逃稅，不如聚焦預留遺產稅稅源、如實申報；繳納遺產稅的三種稅源是繼承人的錢、被繼承人的遺產、遺產外現金。", "壽險身故保險金不是被繼承人的遺產，是受益人的財產，不受遺產稅凍結，受益人可以立刻領取；範例仍是年繳500萬、6年共繳3,000萬、保本解約、保險金6,000萬以上（以宣告利率與分紅實現率達標為前提）。", "遺囑要執行可能有紛爭，壽險不用執行、受益人可立即領到；也可用保險金分期給付保障子女三十年生活；從遺產轉存遺產外保險帳戶後，不再「理所當然等著領」，可以和平傳承。", "顧問式銷售的迷思：期待客戶主動諮詢、花很多錢上一堆聽不懂的課、越學越複雜，最後可能是窮忙與逃避被拒絕；律師醫師是專業為本質、服務是加分，保險業務員則是服務為本質、專業是加分。", "底層邏輯是服務式銷售：成交靠基本動作反覆操練（做人、處事、保險服務的基本功），本業就是以最低保費買到最高保額、最好盡快保本；客戶永遠覺得是他們讓我們賺錢，要以行動感恩。"], "takeaways": ["把「預留遺產稅源」當作開場問題：這筆稅誰來付、從哪裡付？比一堆法條更容易談。", "檢視自己的時間：多少花在學習複雜架構、多少花在真正的客戶服務與關心。"], "pdf": "pdf/20251106.pdf", "videos": [{"key": "20251106完整影片", "title": "完整影片", "url": ""}, {"key": "20251106第1段遺產稅第二回合", "title": "第1段　遺產稅第二回合", "url": ""}, {"key": "20251106第2段人壽保險自益功能", "title": "第2段　人壽保險自益功能", "url": ""}, {"key": "20251106第3段回歸服務式銷售", "title": "第3段　回歸服務式銷售", "url": ""}]}, {"date": "2025/10/16", "topic": "要被受排列的法律風險", "thesis": "要保人、被保險人、受益人怎麼排列，決定了這張保單會碰到遺產稅、所得基本稅額還是贈與稅；排列對了才享有不計入遺產總額的優惠。", "points": ["保險法第112條與遺贈稅法第16條第9款的優惠，講義強調要保人與被保險人須為同一人，且指定受益人領取身故給付，並沒有違反實質課稅原則；國稅局審查動機時會看重病、高齡、短期、躉繳、鉅額、密集、舉債投保等情形。", "若父母為要保人、被保險人是子女或他人，累積的保單價值仍是父母的財產，不論子女是否繼續承保或解約，都要納入遺產總額申報；國稅局提醒，縱使認為不計入遺產總額，也應在申報書中揭露，以免受罰。", "要保人與受益人非同一人的壽險、年金，受益人領取的給付計入基本所得額；講義列出死亡給付每申報戶3,740萬元以下免計入（引用較早函釋時為3,330萬）；非死亡給付（如生存金、滿期金）應全數計入。", "若保單被實質課稅認定為遺產並已課遺產稅，就不再課所得基本稅額；若被認定為贈與並課徵贈與稅，同樣不再課所得基本稅額。", "要保人與被保險人不同：要保人先離世，保價金是要保人遺產；被保險人先離世，受益人領取身故保險金與遺產稅無關。要保人與受益人不同：受益人領取生存金、滿期金時須課贈與稅，要保人對受益人的贈與（要、被、受均不同）也要計入基本所得額。", "要保人為子女風險：子女已婚、有孫子女而先離世時，保價金可能成為遺產，落入媳婦、女婿手中；被保險人先離世的身故保險金則回到受益人手上；講義認為244萬贈與免稅額的唯一好處是降低遺產總額，副作用很多。", "時事議題「兄弟姐妹特留分廢除」：特留分旨在保障繼承人最低限度繼承權與扶養關係；配偶、子女、父母特留分為應繼分一半，兄弟姐妹、祖父母為三分之一；講義指出在修法前兄弟姐妹仍有特留分，修法後配偶、子女、父母、祖父母仍有特留分。", "遺囑違反特留分仍然有效，受侵害者只能向取得遺產者主張扣減權，法院亦得以金錢補償；講義的圓滿三部曲：公證遺囑＋現金補償條款＋高額壽險補償應繼分與特留分，受益人要填「取得遺產的人」。另提醒遺體為公同共有，拋棄繼承效力不及於遺骨，埋葬管理須過半數同意。"], "takeaways": ["規劃保單前，先畫出「要、被、受」三角關係，確認稅別（遺產稅、所得基本稅額、贈與稅）與風險。", "遇到兄弟姐妹特留分話題，回到「遺囑＋補償現金」的作法，不必等修法。"], "pdf": "pdf/20251016.pdf", "videos": [{"key": "20251016完整影片", "title": "完整影片", "url": ""}, {"key": "20251016第1段要被受排列風險", "title": "第1段　要被受排列風險", "url": ""}, {"key": "20251016第2段兄弟姐妹特留分", "title": "第2段　兄弟姐妹特留分", "url": ""}]}, {"date": "2025/09/18", "topic": "遺留房貸的家不是你的", "thesis": "遺產分配與特留分問題，要靠公證遺囑加現金補償條款，並以壽險受益人設計與預留現金處理；同時提醒如實申報、房貸不會因身故而消失。", "points": ["公證遺囑具公文書效力；特留分扣減權是由未受特留分補償者，向取得遺產的繼承人或受遺贈人主張。遺囑可加「現金補償條款」：若有其他繼承人主張特留分，取得遺產者應按取得比例以現金或不動產補償。", "壽險受益人要填寫「取得遺產的人」，身故保險金才能補償其他繼承人的特留分；民法第1224、1173、1225條為特留分算定與扣減依據。", "壽險身故保險金不是遺產，遺囑不能指定受益人為A來當作A的特留分補償；要保人兼被保險人可用遺囑變更受益人，但壽險仍不是遺產，與遺產分配、特留分補償無關。", "被保險人生前已發生、未領取的醫療保險給付是遺產，可透過遺囑分配；講義引用高等法院113年度家上字第146號、108年度上易字第1213號判決說明身故保險金非遺產。", "如實申報：申報遺產稅時若漏報不在財產清單中的資產，依實質課稅原則通常會被認定漏報，抓到就是連補帶罰；境外保單、海外遺產若有內部舉報就會全盤托出。壽險只要如實申報、如實繳稅，國稅局就不會處罰。", "申報遺產稅期限：被繼承人死亡後六個月內；拋棄繼承為知悉得為繼承之日起三個月內，一旦參與申報遺產稅就來不及拋棄繼承。", "房貸三件不同事：銀行存款（可分割繼承）、房貸債務（經銀行同意可轉貸新借款）、不動產抵押權（一直存在不動產上）；繼承人喬不攏就容易繳不出貸款被拍賣。", "遺產稅課徵對象：經常居住境內的本國籍針對境內外全部遺產，經常居住境外的本國籍與外國籍針對境內遺產；講義以此說明子女有外國籍也不能省略預留稅源。", "贈與與婚後財產：講義提醒每年244萬贈與的唯一好處是降低遺產總額，卻隱藏風險（子女早逝、已婚、要保人為子女就失去主控權）；建議保持完全主控權，自己投保、身故時才移轉。保單價值準備金可能列入夫妻剩餘財產分配。"], "takeaways": ["談遺囑時，把「公證遺囑＋現金補償條款＋壽險受益人」一起檢視，讓特留分爭議有現金可解。", "提醒客戶房貸不會自動消失，並把如實申報當成保護家人的底線。"], "pdf": "pdf/20250918.pdf", "videos": [{"key": "20250918完整影片", "title": "完整影片", "url": ""}, {"key": "20250918第1段遺產分配三部曲", "title": "第1段　遺產分配三部曲", "url": ""}, {"key": "20250918第2段裕國冷凍爭產案例", "title": "第2段　裕國冷凍爭產案例", "url": ""}, {"key": "20250918第3段高額房貸繼承風險", "title": "第3段　高額房貸繼承風險", "url": ""}, {"key": "20250918第4段繼承人外國籍風險", "title": "第4段　繼承人外國籍風險", "url": ""}, {"key": "20250918第5段夫妻剩餘財產分配", "title": "第5段　夫妻剩餘財產分配", "url": ""}, {"key": "20250918第6段子父子規劃風險", "title": "第6段　子父子規劃風險", "url": ""}]}, {"date": "2025/09/04", "topic": "高資產客戶說明會", "thesis": "「如果明天就走了、什麼都沒處理」，遺產稅、強制執行、特留分與共有不動產拍賣都會落到家人身上；講義以「遺產外現金」——保本且有倍數保額的壽險——作為最簡單的預備方案。", "points": ["114年遺產稅（講義數字）：免稅額1,333萬、配偶扣除額553萬、喪葬費扣除額138萬；課稅級距為遺產淨額5,621萬以下10%、超過5,621萬至1億1,242萬15%、超過1億1,242萬20%。", "時程與罰則：死亡後六個月內申報、核定後二個月內繳納（依講義條文），逾期每三天加徵1%滯納金，逾三十天未繳送強制執行；未繳清前不得分割遺產、移轉登記，連為了繳稅貸款或出售也不行（看得到、吃不到）。", "實物抵繳：不動產以公告現值抵繳不划算，股票跌價只能按比例抵繳；包含存款在內，都要取得繼承人過半數（及應繼分過半數，或應繼分逾2/3）同意；講義引國稅局範例說明股價低於死亡日時抵繳上限的算法。", "遺產稅是繼承人的固有債務，不是被繼承人生前債務，不能主張限定繼承，強制執行標的不限於遺產，可及於繼承人固有財產並限制出境；繼承人是公法上連帶債務人，每人都負繳納全部遺產稅的責任（講義引民法、遺贈稅法與多則判決）。", "債務人不得應買：不動產被強制執行拍賣時，債務人不得應買，正在居住的家拍賣後就沒了。違反實質課稅原則被列入遺產總額，只是擬制遺產，保險金依舊不是遺產。", "特留分：遺囑要預留特留分補償，否則受侵害者可主張扣減權，可能讓遺囑的遺產分割處分全部無效；講義的解法是遺囑搭配現金補償條款與壽險，用遺產外的現金補償，並引法院判決例（遺產3,282萬、特留分1/6約547萬、補償約428萬）。", "共有不動產風險：無論公同共有或分別共有，共有人可隨時主張分割；講義舉成都楊桃冰店案，17.88坪店面、19位共有人，三拍底價降至約8,097萬元，最後以約8,502萬元脫標，家人只能面對拍賣。建商也可能先買部分持分再逼拍。", "講義結論：用遺囑讓特定繼承人取得不動產完整所有權，並預留找補其他繼承人的保險；「遺囑內容可以慢慢想，但保險要先買起來」。範例：年繳500萬、6年共繳3,000萬，保本解約，身故時6,000萬以上；中小企業主突然離世，壽險可使受益人拋棄繼承後仍能領取。"], "takeaways": ["用「如果明天就走了」開場，帶客戶具體想像：誰要先籌錢繳稅、房子能不能賣。", "把遺囑、特留分補償與壽險受益人設計放在同一張規劃圖裡說明。"], "pdf": "pdf/20250904.pdf", "videos": [{"key": "20250904完整影片", "title": "完整影片", "url": ""}, {"key": "20250904第1段遺產稅普通常識", "title": "第1段　遺產稅普通常識", "url": ""}, {"key": "20250904第2段遺產分配三部曲", "title": "第2段　遺產分配三部曲", "url": ""}, {"key": "20250904第3段中小企業繼承風險", "title": "第3段　中小企業繼承風險", "url": ""}, {"key": "20250904第4段成都楊桃冰案例", "title": "第4段　成都楊桃冰案例", "url": ""}, {"key": "20250904第5段高額房貸繼承風險", "title": "第5段　高額房貸繼承風險", "url": ""}, {"key": "20250904第6段人壽保險自益功能", "title": "第6段　人壽保險自益功能", "url": ""}, {"key": "20250904第7段唯有福慧可以傳家", "title": "第7段　唯有福慧可以傳家", "url": ""}]}, {"date": "2025/08/21", "topic": "人壽保險與不動產投資", "thesis": "講義主張不動產「資產大於負債」可能只是幻覺，沒有成交的價格都是假的；而保本且有倍數保額的壽險，可作為處理房貸、稅源與家人安全感的備援工具。", "points": ["訂閱制讀書會的創立初衷：演講只能概略式說明，改以長期訂閱、一個個主題「少量多餐」細緻講解；下期預告為「民法繼承」最少必要的普通常識。", "講義比較新舊時代：舊時代受戰後全球紅利推動，不動產需求長期大於供給；新時代則因建築技術進步、少子化等，供給增加、需求長期萎縮。", "目前不動產價格推升來自資金氾濫與成本上漲，而非穩定的剛性需求；買家買不起、賣家撐不住貸款，成交量就可能崩跌。", "講義的關鍵觀念：沒有成交的價格都是假的，每個月要繳的貸款本息才是真的；賣不掉時貸款仍要一直繳，最終可能被銀行強制執行拍賣、資不抵債後仍被追討。", "不動產投資本質是開了約5倍的槓桿，認賠20%賣出，投資報酬率就是負100%（講義算法）。", "講義範例：年繳保費500萬、6年共繳3,000萬，原則上解約金保本；身故時保險金6,000萬以上，不受遺產稅凍結，可用來繳遺產稅、清償不動產貸款、補償應繼分與特留分。", "對照：3,000萬不動產要資金時得看銀行臉色；保本3,000萬的保單借款在保價金範圍內，「盡量花、花剩的不用還」，身故時扣剩的再給受益人。", "房貸不會因為家裡辦喪事而停扣；繼承人辦理繼承前，銀行會繼續自被繼承人帳戶扣款；遺產分割後由繼承人推派人成為新借款人，其他繼承人為一般保證。講義提醒預留還清房貸的保險，是對子女最基本的責任與「最後的禮物」。"], "takeaways": ["與有房貸或多筆不動產的客戶談話，可從「現金流與房貸誰來繳」切入，而不是先談商品。", "用簡單的數字範例（繳多少、保本、身故多領多少）讓客戶看懂倍數保額與保本的概念。"], "pdf": "pdf/20250821.pdf", "videos": [{"key": "20250821完整影片", "title": "完整影片", "url": ""}, {"key": "20250821第1段不動產賣不掉卡住", "title": "第1段　不動產賣不掉卡住", "url": ""}, {"key": "20250821第2段不動產是風險", "title": "第2段　不動產是風險", "url": ""}, {"key": "20250821第3段高額房貸繼承風險", "title": "第3段　高額房貸繼承風險", "url": ""}, {"key": "20250821第4段人壽保險自益功能", "title": "第4段　人壽保險自益功能", "url": ""}]}, {"date": "2025/08/07", "topic": "高資產人脈潛規則", "thesis": "保險財富傳承只需掌握最少必要的普通常識並反覆操練；真正的戰場在客戶心智，也就是客戶想到傳承與保險時是否會想到你。", "points": ["專業底氣是基本的：醫術不精的醫師，交情再好也不會把手術交給他；但法律學是無限延伸的案例，學不完，鑽牛角尖與成交關係不大。", "例如高額壽險受益人填寫法定繼承可延伸出無數案例，講義的態度是直接把名字寫上去就好；越學越多反而容易走偏。", "三個保險財富傳承最少必要的普通常識，反覆操練即可；其餘都是基本動作與做人處事。", "形象與口碑：不合身的西裝、泛黃污漬的襯衫、不得體穿著與牙齒衛生、偏見歧視用語、政治雷區、黃腔，客戶感受到的是你內心的信念與起心動念，已經輸掉一半以上。", "客戶「掏得出錢、願意買單的人很多」，重點是要給他們值得為你掏錢的理由；以商務艙、全國電子等例子說明存在的價值與意義。", "看客戶欣賞什麼樣的人、與人互動的模式，同類的人會彼此欣賞；潛在價值取決於你幫忙的對象，要思考對高資產客戶而言重要的是「銷售」還是「服務」。", "點與點最近的距離不是直線，而是一點一滴，創造某種曖昧氛圍；開口談傳承話題不等於一定要成交，定位就是聊個天，自然「滑入」保險財富傳承話題。", "定期定額拜訪、混個臉熟；除了專業與商品，還能聊什麼、一起做什麼有趣的事（如輕旅遊），煩惱在哪裡善緣就在哪裡；目標是客戶想到你時想到保險，想到保險時想到你。"], "takeaways": ["把三個核心常識練到能自然開口，勝過再多學幾條法條。", "安排一次非保險的相處（輕旅遊、共同興趣），讓傳承話題在輕鬆氛圍自然出現。"], "pdf": "pdf/20250807.pdf", "videos": [{"key": "20250807完整影片", "title": "完整影片", "url": ""}, {"key": "20250807第1段普通常識做人處事", "title": "第1段　普通常識做人處事", "url": ""}, {"key": "20250807第2段慣習就是業力", "title": "第2段　慣習就是業力", "url": ""}, {"key": "20250807第3段欣賞骨力打拼的你", "title": "第3段　欣賞骨力打拼的你", "url": ""}, {"key": "20250807第4段想到保險想到你", "title": "第4段　想到保險想到你", "url": ""}, {"key": "20250807第5段煩惱就是善緣", "title": "第5段　煩惱就是善緣", "url": ""}]}, {"date": "2025/07/24", "topic": "人壽保險實質課稅原則", "thesis": "實質課稅原則已立法化，壽險可能被列入遺產總額計算，但這只是「擬制遺產」；只要如實申報、如實繳稅，保險金仍由受益人領取、不受遺產凍結。", "points": ["保險法第112條：指定受益人的保險金額不得作為被保險人遺產；遺贈稅法第16條第9款：約定於被繼承人死亡時給付指定受益人的人壽保險金額，不計入遺產總額。", "納稅者權利保護法第7條讓實質課稅原則明文化：納稅者濫用法律形式、以非常規交易規避稅負即屬租稅規避，除補稅外加徵滯納金（講義列15%）與利息；漏報短報依遺贈稅法第45條，講義列逃漏稅罰鍰0.8倍以下。", "財政部109年函列出壽險實質課稅的八種樣態：重病投保、躉繳投保、舉債投保、高齡投保、短期投保、鉅額投保、密集投保、保險給付低於已繳保費或約等於已繳保費加利息；講義強調只是舉例，量變導致質變。", "講義結論：無論是否違反實質課稅原則，都要如實申報；違反並非不能投保，只要如實申報、如實繳稅就不會被處罰。", "最低稅負制：基本稅額＝（基本所得額－750萬）×20%，與一般所得稅額取高者繳納；要保人與受益人非同一人的壽險／年金給付，每申報戶有3,740萬免稅額（講義所述），超過才列入基本所得額；若死亡給付已被列入遺產總額，不再重複繳基本稅額。", "死亡前二年內贈與配偶等特定親屬的財產，須視為遺產併入計算（遺贈稅法第15條）；憲法法庭113年憲判字第11號指出，該部分增加的稅額僅得向受贈配偶發單，若配偶拋棄繼承則不得向其他繼承人課徵，也不得執行遺產。", "講義引法院見解：高等法院108年度保險上字第36號案，國稅局將94筆保單（保險金合計約1億6,438萬元）認定為短期躉繳投資型保險並列為遺產、核定遺產稅約2,179萬元；法院認為稅務認定不拘束私法效果。結論：縱使被列入遺產總額，也只是擬制遺產，保險金不是遺產、不受凍結。", "年金保險分累積期與給付期，累積期保價金歸屬依要保人／被保險人是否同一人而不同；投資型保險的保險帳戶原則不課遺產稅，投資帳戶則要列入計算。"], "takeaways": ["談壽險免稅時，同步提醒客戶「如實申報」，把稅務風險說清楚，反而更讓客戶安心。", "提醒客戶：被列入遺產總額只是課稅計算，保險金仍由指定受益人領取。"], "pdf": "pdf/20250724.pdf", "videos": [{"key": "20250724完整影片", "title": "完整影片", "url": ""}, {"key": "20250724第1段實質課稅原則解析", "title": "第1段　實質課稅原則解析", "url": ""}, {"key": "20250724第2段所得基本稅額條例", "title": "第2段　所得基本稅額條例", "url": ""}, {"key": "20250724第3段113憲判11號判決", "title": "第3段　113憲判11號判決", "url": ""}, {"key": "20250724第4段永遠是受益人領", "title": "第4段　永遠是受益人領", "url": ""}, {"key": "20250724第5段年金保險課稅實務", "title": "第5段　年金保險課稅實務", "url": ""}, {"key": "20250724第6段投資型課稅實務", "title": "第6段　投資型課稅實務", "url": ""}]}, {"date": "2025/07/10", "topic": "高資產人脈潛規則", "thesis": "高資產客戶不是買不起，而是要先讓他願意跟你談；靠專業底氣、長期的善緣累積與「聊個天」的定位，讓客戶在想到傳承時想到你。", "points": ["壽險是結構最簡單、最古老、保險公司最賺錢、也最進步的保險；講義主張專注賣壽險才有底氣與慈悲，再去幫助客戶補醫療險、意外險。", "高資產客戶只有想不想買，沒有買不買得起的問題；壽險難賣，是因為賣的是客戶永遠不想想到的東西，其實是深層對家人的準備感與安全感，要用理解感性的方式處理，而非只講理性。", "開不了口、遮遮掩掩，常因對保險財富傳承與壽險一知半解、缺少底氣；參加社團要評估每次曝光是加分或減分，不是頭銜咖就先建立專業底氣，才能開啟向上對話。", "三訪、五訪是基本，但在社群時代不夠有競爭力；Facebook、Instagram 呈現的是你這個人與長期價值主義。", "成交關鍵字是「捧場、支持、照顧」；高額壽險規劃的三個關鍵字是「保本、保本、保本」，只是從銀行帳戶轉到保險帳戶，報酬比定存好一點點即可。", "不要一遇到高資產客戶就做全套財富傳承（遺產稅、特留分、遺產分配、清償債務）；壽險本質是用最低成本創造最高保額，可直接買、免體檢、最好盡快保本。", "不定時傳有價值的保險財富傳承文章，「心中留下一顆種子」；練習看淡成交期待，逢人閒聊傳承話題，定位就是聊個天。", "客戶買了境外保單時，不否定、不教育客戶：背後必有故事，境外資產境外處理、境內資產境內處理；姿態放低、保持謙卑，核心是「服務」。"], "takeaways": ["下次拜訪不急著成交，先用一個傳承小故事或時事聊天，種下一顆種子。", "遇到客戶已有境外保單，先理解與尊重，再找境內可補強的缺口。"], "pdf": "pdf/20250710.pdf", "videos": [{"key": "20250710完整影片", "title": "完整影片", "url": ""}, {"key": "20250710第1段人壽保險吃一輩子", "title": "第1段　人壽保險吃一輩子", "url": ""}, {"key": "20250710第2段戰場在於客戶心智", "title": "第2段　戰場在於客戶心智", "url": ""}, {"key": "20250710第3段捧場支持照顧成交", "title": "第3段　捧場支持照顧成交", "url": ""}, {"key": "20250710第4段成交關鍵字是保本", "title": "第4段　成交關鍵字是保本", "url": ""}, {"key": "20250710第5段老實做事印象重要", "title": "第5段　老實做事印象重要", "url": ""}]}, {"date": "2025/06/26", "topic": "意定監護保險金信託", "thesis": "客戶若成為受監護或輔助宣告者，保險怎麼投保、怎麼變更、怎麼規劃信託都會受到限制；意定監護搭配保險金信託，才能事先預留彈性與保護。", "points": ["行為能力分級：未滿七歲無行為能力、七歲以上未成年為限制行為能力、滿十八歲成年；受監護宣告者無行為能力，受輔助宣告者有限制行為能力（民法第12至15-2條）。", "受輔助宣告者進行重要行為（如借貸、保證、贈與、信託、不動產處分、遺產分割、拋棄繼承等）須經輔助人同意。", "保險實務：受監護、輔助宣告者辦理投保，均應經監護人、輔助人同意；無行為能力或限制行為能力者，要保人或被保險人須經法定代理人同意。", "保險法第107-1條：以受監護宣告尚未撤銷者為被保險人訂立人壽保險，除喪葬費用外，其餘死亡給付無效；喪葬費額度不得超過遺產稅喪葬費扣除額的一半（講義列為69萬元）。原本已有效的壽險，不會因事後受監護宣告而受影響。", "法定監護人處分受監護人財產須為其利益；購置或處分不動產、出租居住用房屋須經法院許可；也不得以其財產投資（公債等除外）。講義帶出疑問：能否投保投資型保險、醫療險、意外險、壽險？", "講義引用法院判決：受益人變更若只涉及指定受益人的保險金請求權，並非受讓被監護人的財產，不違反監護人不得受讓財產的規定。", "意定監護契約須經公證才成立，本人受監護宣告時才生效；契約可特約監護人處理不動產毋須法院許可、也可進行投資（民法第1113-9條）。", "保險金信託：本質是金錢信託，委託人須為保險契約的受益人，屬自益信託；可設定指示權人、給付方式（定期給付或憑單據給付如安養照護費、醫療費、教育費、喪葬費）、能否修改、解除、終止。講義所列費用例：簽約手續費保險金信託3,000元、金錢信託5,000元；管理費年費率1,000萬以下0.5%、1,000至3,000萬0.4%、超過3,000萬0.3%，每年最低1,000元。"], "takeaways": ["與客戶談長輩、身心障礙者或失智風險時，可先釐清「誰能代為決定」：意定監護與保險金信託是事先安排的工具。", "投保對象若可能受監護宣告，先確認同意權人與保險法限制，避免契約部分無效。"], "pdf": "pdf/20250626.pdf", "videos": [{"key": "20250626完整影片", "title": "完整影片", "url": ""}, {"key": "20250626第1段意定監護制度", "title": "第1段　意定監護制度", "url": ""}, {"key": "20250626第2段保險金信託制度", "title": "第2段　保險金信託制度", "url": ""}]}, {"date": "2025/03/13", "topic": "生命故事與思維", "thesis": "成交的底層邏輯不在產品與話術，而在「你是一個什麼樣的人」；累積善念與福報，才是長久被客戶信任的根基。", "points": ["開場提問：同樣讀書、上課、努力，為什麼有人賺得到錢、有人賺不到？講義指出「道理都知道、卻做不到」，關鍵在慣習。", "慣習是一個人的「業」：善的叫福報，惡的叫業障；日常小事（公筷、說話太近、口頭禪、LINE 錯字一堆又不排版）都在影響別人對你的觀感。", "講義提醒：若連約訪都被打槍，連對話的可能性都沒有，上再多課也不會成交。", "無論產品、事業再好，你永遠不是唯一的提供者；客戶只是喜歡跟你在一起，「你是一個什麼樣的人」才是成交的底層邏輯，轉向內在即是出路。", "檢視通訊錄：我們有把握哪幾個人發自內心希望我們成功、幸福快樂？反過來，我們又如何看待、對待生命中有緣相遇的人？對人好，別人也會對我好。", "「那個人」的特質：不是外表光鮮、博學多聞或擅長應酬，而是多年參與我們的生命、不需要前情提要、長時間不讓人失望；最後的單，一定是「那個人」收走的。", "物質生活達到一定程度後，隱微的擔憂是福報會不會用盡；講義主張「錢無法傳承，唯有福慧得以傳家」，並以每日睡前善念祈願、積善種福作為實踐。", "講者分享自身經驗：幫助過很多人之後，善緣自然回流，人與人生命的連結就是善緣力量，是觸動內心的溫暖感受，而非頭腦邏輯。"], "takeaways": ["先把自己變成客戶心中「那個人」：言行、文字、服務細節都是信任的一部分，再談產品。", "每天花一點時間檢視通訊錄，真心希望對方好，用長時間的不失望累積信任。"], "pdf": "pdf/20250313.pdf", "videos": [{"key": "20250313完整影片", "title": "完整影片", "url": ""}, {"key": "20250313第1段人與人差距是福報", "title": "第1段　人與人差距是福報", "url": ""}, {"key": "20250313第2段客戶心中的那個人", "title": "第2段　客戶心中的那個人", "url": ""}, {"key": "20250313第3段自天佑之吉無不利", "title": "第3段　自天佑之吉無不利", "url": ""}, {"key": "20250313第4段做一個簡單的好人", "title": "第4段　做一個簡單的好人", "url": ""}]}];
const app=document.getElementById('app'),q=document.getElementById('q');
function embed(u){
  let m;
  if(m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/))return{t:'i',s:'https://www.youtube.com/embed/'+m[1]+'?rel=0&autoplay=1'};
  if(m=u.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/(\w+))?/))return{t:'i',s:'https://player.vimeo.com/video/'+m[1]+(m[2]?'?h='+m[2]:'')};
  if(/\.(mp4|webm|mov)(\?|$)/i.test(u))return{t:'v',s:u};
  return{t:'i',s:u};
}
function play(v,s){
  const e=embed(v.url),fr=document.getElementById('fr');
  fr.innerHTML='';
  let el;
  if(e.t==='v'){el=document.createElement('video');el.controls=true;el.autoplay=true;el.playsInline=true;el.src=e.s}
  else{el=document.createElement('iframe');el.src=e.s;el.allow='autoplay; fullscreen; picture-in-picture';el.allowFullscreen=true}
  fr.appendChild(el);
  document.getElementById('ttl').textContent=s.date+' '+s.topic+'｜'+v.title;
  document.getElementById('m').classList.add('on');
}
function close(){document.getElementById('fr').innerHTML='';document.getElementById('m').classList.remove('on')}
document.getElementById('x').onclick=close;
document.getElementById('m').onclick=e=>{if(e.target.id==='m')close()};
let mode='s';
function hay(s){return (s.date+s.date.replace(/\//g,'')+s.topic+(s.thesis||'')+(s.points||[]).join('')+(s.takeaways||[]).join('')).toLowerCase()}
function esc(t,el){el.textContent=t;return el}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function ul(cls,arr){const u=mk('ul',cls);arr.forEach(t=>u.appendChild(mk('li',null,t)));return u}
function render(){
  const k=q.value.trim().toLowerCase();
  app.innerHTML='';app.className=mode==='a'?'all':'';
  document.getElementById('t1').className=mode==='s'?'on':'';
  document.getElementById('t2').className=mode==='a'?'on':'';
  const list=DATA.filter(s=>!k||hay(s).includes(k));
  if(!list.length){app.innerHTML='<div class="none">找不到符合的場次</div>';return}
  if(mode==='a'){
    app.appendChild(mk('div','cnt','共 '+list.length+' 場重點整理（依日期新到舊）'));
    list.forEach(s=>{
      const a=mk('article');
      a.appendChild(mk('div','d',s.date));a.appendChild(mk('h2',null,s.topic));
      if(s.thesis){a.appendChild(mk('div','thesis',s.thesis));
        a.appendChild(mk('div','lbl','重點'));a.appendChild(ul('pts',s.points));
        a.appendChild(mk('div','lbl','可以怎麼用'));a.appendChild(ul('tks',s.takeaways));}
      if(s.pdf){const l=mk('a','pdfl','開啟講義 PDF');l.href=s.pdf;l.target='_blank';l.rel='noopener';a.appendChild(l)}
      app.appendChild(a);
    });
    return;
  }
  list.forEach((s,i)=>{
    const d=document.createElement('div');d.className='s'+(k||i===0?' open':'');
    const h=document.createElement('button');
    h.innerHTML='<div class="d"></div><div class="t"></div><div class="c"></div>';
    h.children[0].textContent=s.date;h.children[1].textContent=s.topic;const nv=s.videos.filter(v=>v.url).length;
    const bits=[];if(s.thesis)bits.push('重點整理');if(nv)bits.push(nv+' 支影片');if(s.pdf)bits.push('講義 PDF');
    h.children[2].textContent=bits.join('・');
    h.onclick=()=>d.classList.toggle('open');
    const l=document.createElement('div');l.className='list';
    if(s.thesis){
      const b=mk('div','sum');b.appendChild(mk('div','thesis',s.thesis));
      const dt=document.createElement('details');if(k)dt.open=true;
      dt.appendChild(mk('summary',null,'重點整理（'+s.points.length+' 點）'));
      dt.appendChild(ul('pts',s.points));
      dt.appendChild(mk('div','lbl','可以怎麼用'));dt.appendChild(ul('tks',s.takeaways));
      b.appendChild(dt);l.appendChild(b);
    }
    if(s.pdf){const a=document.createElement('a');a.className='v pdf';a.href=s.pdf;a.target='_blank';a.rel='noopener';a.style.textDecoration='none';
      a.innerHTML='<span class="p">PDF</span><span>講義 PDF</span><small>開啟／下載</small>';l.appendChild(a)}
    s.videos.filter(v=>v.url).forEach(v=>{
      const b=document.createElement('button');b.className='v';
      b.innerHTML='<span class="p">▶</span><span></span><small></small>';
      b.children[1].textContent=v.title;
      b.onclick=()=>play(v,s);
      l.appendChild(b);
    });
    d.append(h,l);app.appendChild(d);
  });
}
document.getElementById('t1').onclick=()=>{mode='s';render();window.scrollTo(0,0)};
document.getElementById('t2').onclick=()=>{mode='a';render();window.scrollTo(0,0)};
q.oninput=render;render();
</script>
